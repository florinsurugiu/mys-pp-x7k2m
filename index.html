<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #14161a;
    --bg-elevated: #1c1f25;
    --border: #2a2e36;
    --text: #eceef1;
    --text-dim: #9aa1ad;
    --text-faint: #656d7a;
    --accent: #5fc2c9;
    --accent-dim: #2f4d50;
    --good: #6fbf73;
    --warn: #e0b355;
    --bad: #e0705f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f4f1;
      --bg-elevated: #ffffff;
      --border: #e2e0da;
      --text: #1d1f23;
      --text-dim: #5b5f68;
      --text-faint: #90949c;
      --accent: #1f8790;
      --accent-dim: #d8eeef;
      --good: #2f8f3a;
      --warn: #a1720f;
      --bad: #b8422f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-elevated: #1c1f25; --border: #2a2e36;
    --text: #eceef1; --text-dim: #9aa1ad; --text-faint: #656d7a;
    --accent: #5fc2c9; --accent-dim: #2f4d50;
    --good: #6fbf73; --warn: #e0b355; --bad: #e0705f;
  }
  :root[data-theme="light"] {
    --bg: #f5f4f1; --bg-elevated: #ffffff; --border: #e2e0da;
    --text: #1d1f23; --text-dim: #5b5f68; --text-faint: #90949c;
    --accent: #1f8790; --accent-dim: #d8eeef;
    --good: #2f8f3a; --warn: #a1720f; --bad: #b8422f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 28px; }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .meta { font-size: 0.8rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-pill { font-size: 0.72rem; color: var(--text-faint); font-variant-numeric: tabular-nums; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .meta strong { color: var(--text-dim); font-weight: 600; }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 640px) { .grid-two { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-faint); font-weight: 700; margin: 0 0 12px;
  }
  .person-name { font-size: 1.05rem; font-weight: 700; }
  .hours-row { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 10px; }
  .hours-val { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hours-cap { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; margin-bottom: 14px; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .3s; }
  .bar.warn > span { background: var(--warn); }
  .bar.over > span { background: var(--bad); }

  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 0.86rem; }
  .item-title { color: var(--text); }
  .item-sub { color: var(--text-faint); font-size: 0.76rem; }
  .item-hours { font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
    vertical-align: middle;
  }
  .badge.predicted { background: var(--accent-dim); color: var(--accent); }
  .badge.leftover { background: rgba(240, 165, 90, 0.16); color: var(--warn); }
  .badge.buffer { background: rgba(180, 220, 250, 0.16); color: #8fc8f0; }
  .badge.wb { background: rgba(120, 130, 250, 0.16); color: #9aa3ff; }
  .badge.shopify { background: rgba(120, 220, 150, 0.16); color: #7bd99a; }

  section.block { margin-bottom: 20px; }
  .block-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .block-header h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .block-header .total { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .backlog-list { display: flex; flex-direction: column; gap: 0; }
  .backlog-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .backlog-row:last-child { border-bottom: none; }
  .order-tag { font-variant-numeric: tabular-nums; color: var(--text-faint); font-size: 0.76rem; flex: 0 0 76px; padding-top: 1px; }
  .backlog-main { flex: 1; min-width: 0; }

  .empty { color: var(--text-faint); font-size: 0.85rem; padding: 6px 0; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .error { color: var(--bad); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 0.88rem; color: var(--text-faint);
    padding: 10px 4px; margin-right: 20px; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .settings-btn {
    margin-right: 0; padding: 6px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; line-height: 1; background: var(--bg-elevated); flex: 0 0 auto;
  }
  .settings-btn.active { background: var(--accent-dim); border-color: var(--accent); }

  .push-btn {
    appearance: none; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent);
    font: inherit; font-weight: 700; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px;
    cursor: pointer; transition: opacity .15s;
  }
  .push-btn:hover { opacity: 0.85; }

  .reco-list { display: flex; flex-direction: column; gap: 12px; }
  .reco { display: flex; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .reco .reco-num { font-size: 1.3rem; font-weight: 700; color: var(--accent); flex: 0 0 auto; width: 26px; }
  .reco .reco-body h4 { margin: 0 0 6px; font-size: 0.92rem; font-weight: 700; }
  .reco .reco-body p { margin: 0; font-size: 0.85rem; color: var(--text-dim); line-height: 1.55; }

  .period-filter { display: flex; gap: 8px; margin-bottom: 16px; }
  .period-btn {
    appearance: none; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-dim);
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all .15s;
  }
  .period-btn:hover { color: var(--text); }
  .period-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form-input, .form-select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 0.85rem; padding: 8px 10px; border-radius: 6px;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
  .proj-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .proj-row:last-child { border-bottom: none; }
  .proj-remove {
    appearance: none; border: none; background: none; color: var(--text-faint);
    cursor: pointer; font-size: 0.9rem; padding: 2px 6px;
  }
  .proj-remove:hover { color: var(--bad); }
  .status-chip { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 20px; font-weight: 700; margin-left: 8px; }
  .status-chip.confirmat { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
  .status-chip.probabil { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .estimate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .estimate-field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .estimate-field .form-input { width: 100%; }
  .storage-note { font-size: 0.74rem; color: var(--text-faint); margin-top: 10px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-card[title] { cursor: help; }
  .stat-card[title] .stat-label { text-decoration: underline dotted var(--text-faint); text-underline-offset: 3px; }
  .stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stat-value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.good { color: var(--good); }
  .stat-value.bad { color: var(--bad); }
  .stat-sub { font-size: 0.72rem; color: var(--text-faint); margin-top: 2px; font-variant-numeric: tabular-nums; }

  table.trend { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.trend th, table.trend td { text-align: right; padding: 8px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.trend th:first-child, table.trend td:first-child { text-align: left; }
  table.trend th { color: var(--text-faint); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  table.trend td { border-bottom: 1px solid var(--border); }
  table.trend tr:last-child td { border-bottom: none; }
  table.trend .roas-good { color: var(--good); }
  table.trend .roas-bad { color: var(--bad); }
  table.trend .totals-row td { font-weight: 700; border-bottom: none; }
  .table-scroll { overflow-x: auto; }

  @media (max-width: 860px) {
    table.trend thead { display: none; }
    table.trend, table.trend tbody, table.trend tr, table.trend td { display: block; width: 100%; }
    table.trend tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
    table.trend tr:last-child { border-bottom: none; }
    table.trend td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 3px 0; border-bottom: none; white-space: normal; text-align: right; }
    table.trend td::before { content: attr(data-label); color: var(--text-faint); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; text-align: left; }
    table.trend td:first-child { font-weight: 700; font-size: 0.88rem; padding-bottom: 6px; }
    table.trend td:first-child::before { content: ''; }
  }

  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); font-weight: 700; margin: 28px 0 12px;
  }
  .section-title:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MY Dashboard</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="meta-pills" id="meta"><span class="meta-pill">se incarca...</span></div>
      <button class="settings-btn tab-btn" data-tab="settings" title="Setari">&#9881;</button>
    </div>
  </header>
  <div class="tabs">
    <button class="tab-btn active" data-tab="production">Productie</button>
    <button class="tab-btn" data-tab="profit">Profit &amp; ROAS</button>
    <button class="tab-btn" data-tab="pnl">P&amp;L</button>
    <button class="tab-btn" data-tab="reco">Imbunatatiri</button>
  </div>
  <div class="tab-panel active" id="panel-production">
    <div id="root-production">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-profit">
    <div id="root-profit">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-pnl">
    <div id="root-pnl">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-reco">
    <div id="root-reco">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-settings">
    <div id="root-settings">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
</div>
<script>
async function load() {
  const rootProduction = document.getElementById('root-production');
  const rootProfit = document.getElementById('root-profit');
  const rootPnl = document.getElementById('root-pnl');
  const rootReco = document.getElementById('root-reco');
  const rootSettings = document.getElementById('root-settings');
  const meta = document.getElementById('meta');
  const metaParts = [];
  let productionData = null, profitData = null, pnlData = null;

  try {
    const res = await fetch('dashboard-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    productionData = await res.json();
    renderProduction(productionData, rootProduction);
    metaParts.push('Asana ' + fmtDateTime(productionData.generatedAt));
    metaParts.push('W&amp;B ' + fmtDateTime(productionData.generatedAt));
  } catch (e) {
    rootProduction.innerHTML = '<div class="error">Nu am putut incarca datele de productie (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('profit-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    profitData = await res.json();
    renderProfit(profitData, rootProfit);
    metaParts.push('Meta ' + fmtDateTime(profitData.generatedAt));
    metaParts.push('Shopify ' + fmtDateTime(profitData.generatedAt));
  } catch (e) {
    rootProfit.innerHTML = '<div class="error">Nu am putut incarca datele de profit (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('pnl-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    pnlData = await res.json();
    renderPnl(pnlData, rootPnl);
  } catch (e) {
    rootPnl.innerHTML = '<div class="error">Nu am putut incarca datele P&amp;L (' + e.message + ').</div>';
  }

  try {
    renderReco(productionData, profitData, pnlData, rootReco);
  } catch (e) {
    rootReco.innerHTML = '<div class="error">Nu am putut calcula recomandarile (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('settings-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    renderSettings(data, rootSettings);
  } catch (e) {
    rootSettings.innerHTML = '<div class="error">Nu am putut incarca datele de setari (' + e.message + ').</div>';
  }

  meta.innerHTML = metaParts.map((p) => '<span class="meta-pill">' + p + '</span>').join('');
}

function initTabs() {
  const buttons = document.querySelectorAll('.tab-btn');
  const activateTab = (name, updateHash) => {
    const btn = [...buttons].find((b) => b.dataset.tab === name);
    if (!btn) return false;
    buttons.forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
    if (updateHash) history.replaceState(null, '', '#' + name);
    return true;
  };
  buttons.forEach((btn) => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab, true));
  });
  window.addEventListener('hashchange', () => activateTab(location.hash.slice(1), false));
  const initial = location.hash.slice(1);
  if (!initial || !activateTab(initial, false)) activateTab('production', false);
}

function pushToAsana() {
  const ok = window.confirm('Sigur vrei sa publici planul de azi pe Asana? Se vor crea task-uri reale pentru Carl, Felicia si Flori.');
  if (!ok) return;
  window.open(
    'https://github.com/florinsurugiu/mysimplicated-theme/actions/workflows/production-planning.yml',
    '_blank'
  );
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'long' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ro-RO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace(/\./g, '');
}
function barClass(hours, capacity) {
  const ratio = hours / capacity;
  if (ratio > 1.02) return 'over';
  if (ratio > 0.92) return 'warn';
  return '';
}
function sourceBadge(source) {
  if (source === 'predicted') return '<span class="badge predicted">PR</span>';
  if (source === 'leftover') return '<span class="badge leftover">ramas</span>';
  if (source === 'buffer') return '<span class="badge buffer">taiat</span>';
  if (source === 'wb') return '<span class="badge wb">WB</span>';
  if (source === 'shopify') return '<span class="badge shopify">SH</span>';
  return '';
}

function personCard(name, person) {
  const cls = barClass(person.hours, person.capacity);
  const pct = Math.min(100, (person.hours / person.capacity) * 100);
  const items = person.items.length
    ? person.items.map((it) => (
        '<li class="item">' +
          '<div class="item-title">' + escapeHtml(it.title) + sourceBadge(it.source) + '</div>' +
          '<div class="item-hours">' + it.hours.toFixed(2).replace('.', ',') + 'h</div>' +
        '</li>'
      )).join('')
    : '<div class="empty">Fara task-uri.</div>';
  return (
    '<div class="card">' +
      '<div class="person-name">' + name + '</div>' +
      '<div class="hours-row"><span class="hours-val">' + person.hours.toFixed(2).replace('.', ',') + 'h</span>' +
      '<span class="hours-cap">/ ' + person.capacity + 'h</span></div>' +
      '<div class="bar ' + cls + '"><span style="width:' + pct + '%"></span></div>' +
      '<ul class="items">' + items + '</ul>' +
    '</div>'
  );
}

function croitSection(croit) {
  const rows = croit.length
    ? croit.map((t) => (
        '<div class="backlog-row">' +
          '<span class="order-tag">' + (t.orderName ? escapeHtml(t.orderName) : '') + '</span>' +
          '<span class="backlog-main">' + escapeHtml(t.name) + (t.leftover ? sourceBadge('leftover') : '') + '</span>' +
        '</div>'
      )).join('')
    : '<div class="empty">Nimic in coada -- Carl e la zi.</div>';
  return (
    '<section class="block card">' +
      '<div class="block-header"><h2>Carl -- ' + croit.length + ' in asteptare</h2></div>' +
      '<div class="backlog-list">' + rows + '</div>' +
    '</section>'
  );
}

function croitBufferSection(buffer) {
  const rows = buffer.length
    ? buffer.map((t) => (
        '<div class="backlog-row">' +
          '<span class="order-tag">' + (t.orderName ? escapeHtml(t.orderName) : '') + '</span>' +
          '<span class="backlog-main">' + escapeHtml(t.name) + '</span>' +
        '</div>'
      )).join('')
    : '<div class="empty">Fara buffer -- nimic deja taiat in stoc.</div>';
  return (
    '<section class="block card">' +
      '<div class="block-header"><h2>Croit (buffer taiat) -- ' + buffer.length + '</h2></div>' +
      '<div class="item-sub" style="margin-bottom:10px">Deja taiat de Carl, in asteptare la cusut -- legat de o comanda sau stoc generic.</div>' +
      '<div class="backlog-list">' + rows + '</div>' +
    '</section>'
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderProduction(data, root) {
  const backlogItems = data.backlog.items.length
    ? data.backlog.items.map((it) => (
        '<div class="backlog-row">' +
          '<span class="order-tag">' + escapeHtml(it.orderName) + '</span>' +
          '<span class="backlog-main">' + escapeHtml(it.title) + '</span>' +
          '<span class="item-hours">' + it.hours.toFixed(2).replace('.', ',') + 'h</span>' +
        '</div>'
      )).join('')
    : '<div class="empty">Nimic in asteptare -- toate comenzile reale au incaput azi.</div>';

  const planDate = new Date(data.planDate + 'T00:00:00');
  const now = new Date();
  const fmtFull = (d) => d.toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtTime = (d) => d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });

  root.innerHTML =

let profitDataCache = null;

/** Proiectie de venit D2C pt luna calendaristica curenta, bazata pe
 * vanzarile reale Shopify din profit-data.json (nu pe media istorica) --
 * suma zilelor scurse din luna, extrapolata liniar pe restul zilelor. */
function computeCurrentMonthRunRate() {
  if (!profitDataCache || !profitDataCache.days || !profitDataCache.days.length) return null;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthDays = profitDataCache.days.filter((d) => {
    const dt = new Date(d.date + 'T00:00:00');
    return dt.getFullYear() === y && dt.getMonth() === m;
  });
  if (!monthDays.length) return null;
  const actual = monthDays.reduce((s, d) => s + d.revenue, 0);
  const daysElapsed = monthDays.length;
  const projected = (actual / daysElapsed) * daysInMonth;
  return { actual, daysElapsed, daysInMonth, projected };
}

/** "Luna curenta" nu mai arata ultima luna reala (poate fi atipica), ci o
 * medie mai realista. COGS foloseste media pe tot intervalul (8 luni) cu
 * costul proiectelor B2B scazut (e singura cifra de proiect verificata,
 * doar ca total agregat pe tot intervalul -- nu se poate izola pe un
 * subset de luni). Marketing/salarii/taxe/altele folosesc media doar pe
 * ultimele 4 luni: Decembrie are salarii/taxe 0 (date lipsa, nu o luna
 * reala fara costuri) si Martie are cifre neobisnuit de mici -- incluse
 * in medie, trag artificial estimarea in jos fata de nivelul actual de
 * echipa/cheltuieli. Venitul B2B recurent istoric NU intra in baseline --
 * utilizatorul prefera sa se raporteze doar la ce adauga manual in
 * "Proiecte B2B incoming", nu la o medie auto-calculata pe care nu o
 * controleaza. */
// echipa curenta, RON/luna -- cifra reala data de utilizator, mai precisa
// decat orice medie istorica (de actualizat manual daca se schimba echipa)
const CURRENT_TEAM_SALARIES = { Felicia: 5000, Flori: 5000, Carl: 4500, Alexio: 8000 };

// taxe platite efectiv in luna curenta (August 2026) -- cifre reale din
// ordinele de plata (Bad Copy: impozit pe profit 6.669 + TVA decont lunar
// 7.103, pt obligatii din Iunie; Simplicated deja platit luna trecuta,
// fara suma noua acum). De actualizat manual cand vine urmatorul decont.
const CURRENT_MONTH_TAXES_PAID = { 'Bad Copy - impozit profit': 6669, 'Bad Copy - TVA': 7103 };

function computeBaselineAverage(data) {
  const rows = data.rows;
  const n = rows.length;
  const recent = rows.slice(-4);
  const rn = recent.length;
  const sum = (key) => rows.reduce((s, r) => s + r[key], 0);
  const sumRecent = (key) => recent.reduce((s, r) => s + r[key], 0);
  const totalProjectCost = Object.values(data.projectCosts).reduce((s, p) => s + p.cost, 0);
  const d2c = sum('d2c') / n;
  const revenue = d2c;
  const cogs = (sum('cogs') - totalProjectCost) / n;
  const marketing = sumRecent('marketing') / rn;
  const salaries = Object.values(CURRENT_TEAM_SALARIES).reduce((a, b) => a + b, 0);
  // Taxe: folosim suma reala platita deja luna asta (CURRENT_MONTH_TAXES_PAID)
  // ca baza cunoscuta -- mai precisa decat orice estimare. "Taxe" e un bucket
  // mixt: TVA si CAS se platesc lunar (urmaresc direct veniturile/salariile
  // lunii), dar impozitul pe profit/venitul microintreprinderilor se
  // plateste trimestrial -- de-asta o luna poate arata taxe mari fara
  // legatura cu propriul ei venit (ex. Iulie, desi n-a avut B2B, reflecta
  // partial decontul trimestrial Q2 care include B2B-urile mari din
  // Apr/Iun). Raportul taxe/venit pe TOT intervalul (fiecare trimestru
  // numarat o singura data) e folosit doar ca fallback cand nu avem o
  // suma reala platita.
  const knownTaxesPaid = Object.values(CURRENT_MONTH_TAXES_PAID).reduce((a, b) => a + b, 0);
  const taxRate = sum('taxes') / sum('revenue');
  const taxes = knownTaxesPaid > 0 ? knownTaxesPaid : revenue * taxRate;
  // "Personal" (calatorii + cumparaturi card firma) nu e cost real de
  // business -- scazut DOAR din baseline-ul Luna curenta, istoricul
  // (Toate/3/6 luni) ramane neatins.
  const personalCat = (data.categoryBreakdown || []).find((c) => c.name.startsWith('Personal'));
  const personalMonthlyAvg = personalCat ? personalCat.val / n : 0;
  const other = sumRecent('other') / rn - personalMonthlyAvg;
  const net = revenue - (cogs + marketing + salaries + taxes + other);
  return {
    label: 'Medie ' + n + ' luni (D2C, fara B2B)', d2c, b2bProject: 0, b2bOther: 0, revenue,
    cogs, marketing, salaries, taxes, other, net, klarnaMissing: false,
  };
}

/** Rand sintetic pt luna curenta (August), folosit doar cand se aduna la
 * "Toate" -- ca istoricul + estimarea curenta sa dea un total realist, nu
 * doar cele 8 luni cu date reale. Foloseste acelasi calcul ca stat cardurile
 * de pe Luna curenta (D2C din rulaj real + B2B incoming). */
function buildCurrentMonthEstimateRow(data) {
  const avg = computeBaselineAverage(data);
  const runRate = computeCurrentMonthRunRate();
  const d2c = runRate ? runRate.projected : avg.revenue;
  const incomingB2BTotal = loadIncomingProjects().reduce((s, p) => s + p.amount, 0);
  const revenue = d2c + incomingB2BTotal;
  const net = revenue - (avg.cogs + avg.marketing + avg.salaries + avg.taxes + avg.other);
  const monthName = new Date().toLocaleDateString('ro-RO', { month: 'short', year: 'numeric' });
  return {
    month: 'estimat', label: monthName + ' (estimat)', d2c, b2bProject: 0, b2bOther: incomingB2BTotal,
    revenue, cogs: avg.cogs, marketing: avg.marketing, salaries: avg.salaries, taxes: avg.taxes, other: avg.other,
    net, klarnaMissing: false,
  };
}

function renderPnlPeriod(root) {
  const data = pnlDataCache;
  const isSingleMonth = pnlPeriod === 1;
  let filteredRows, t;
  if (isSingleMonth) {
    const avg = computeBaselineAverage(data);
    filteredRows = [avg];
    t = avg;
  } else {
    const sliceCount = pnlPeriod === 'lastMonth' ? 1 : pnlPeriod;
    filteredRows = data.rows.slice(-sliceCount);
    if (pnlPeriod === data.rows.length) {
      // "Toate" include si estimarea lunii curente, nu doar istoricul --
      // altfel totalul pare incomplet fata de ce arata Luna curenta.
      filteredRows = [...filteredRows, buildCurrentMonthEstimateRow(data)];
    }
    t = filteredRows.reduce((acc, r) => {
      acc.d2c += r.d2c; acc.b2bProject += r.b2bProject; acc.b2bOther += r.b2bOther;
      acc.revenue += r.revenue; acc.cogs += r.cogs; acc.marketing += r.marketing;
      acc.salaries += r.salaries; acc.taxes += r.taxes; acc.other += r.other; acc.net += r.net;
      return acc;
    }, { d2c: 0, b2bProject: 0, b2bOther: 0, revenue: 0, cogs: 0, marketing: 0, salaries: 0, taxes: 0, other: 0, net: 0 });
  }

  const monthOptions = [1, 'lastMonth', 3, 6, data.rows.length];
  const filterBtns = [...new Set(monthOptions)].map((m) => (
    '<button class="period-btn' + (m === pnlPeriod ? ' active' : '') + '" onclick="setPnlPeriod(' + (typeof m === 'string' ? "'" + m + "'" : m) + ')">' +
      (m === data.rows.length ? 'Toate' : m === 1 ? 'Luna curenta' : m === 'lastMonth' ? 'Luna trecuta' : m + ' luni') +
    '</button>'
  )).join('');

  const statCard = (label, value, sub, cls, tooltip) =>
    '<div class="stat-card"' + (tooltip ? ' title="' + tooltip.replace(/"/g, '&quot;') + '"' : '') + '>' +
    '<div class="stat-label">' + label + '</div>' +
    '<div class="stat-value' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';

  const costsTooltip = (n, recentN) => 'COGS ' + fmtMoney(t.cogs) + (n ? ' (medie ' + n + ' luni)' : '') +
    ' · Marketing ' + fmtMoney(t.marketing) + ' · Salarii ' + fmtMoney(t.salaries) + ' · Taxe ' + fmtMoney(t.taxes) + ' · Altele ' + fmtMoney(t.other) +
    (recentN ? ' (medie ultimele ' + recentN + ' luni)' : '');

  const incomingB2BTotal = isSingleMonth ? loadIncomingProjects().reduce((s, p) => s + p.amount, 0) : 0;
  const runRate = isSingleMonth ? computeCurrentMonthRunRate() : null;
  const d2cEstimate = runRate ? runRate.projected : t.revenue;
  const costsTotal = t.cogs + t.marketing + t.salaries + t.taxes + t.other;
  const netEstimate = d2cEstimate - costsTotal;
  const revenueWithIncoming = d2cEstimate + incomingB2BTotal;
  const netWithIncoming = netEstimate + incomingB2BTotal;
  const stats = isSingleMonth ?
    statCard('Venit D2C estimat (luna curenta)', fmtMoney(d2cEstimate), runRate
      ? fmtMoney(runRate.actual) + ' in ' + runRate.daysElapsed + ' din ' + runRate.daysInMonth + ' zile -- proiectat pe rulaj real'
      : 'medie D2C pe ' + data.rows.length + ' luni (inca nu avem vanzari reale pt luna asta)') +
    statCard('Venit estimat (D2C + B2B incoming)', fmtMoney(revenueWithIncoming), incomingB2BTotal > 0 ? 'D2C ' + fmtMoney(d2cEstimate) + ' + B2B incoming ' + fmtMoney(incomingB2BTotal) : 'niciun proiect B2B incoming adaugat inca') +
    statCard('Costuri medii / luna', fmtMoney(costsTotal), 'COGS (medie 8 luni, fara cost proiecte) · restul (medie ultimele 4 luni)', null, costsTooltip(data.rows.length, 4)) +
    statCard('Rezultat net estimat', (netWithIncoming >= 0 ? '+' : '') + fmtMoney(netWithIncoming), incomingB2BTotal > 0 ? 'D2C real + B2B incoming (' + fmtMoney(incomingB2BTotal) + ')' : 'pe baza vanzarilor D2C reale, fara proiecte B2B', netWithIncoming >= 0 ? 'good' : 'bad')
    :
    statCard('Venit total (' + filteredRows.length + ' luni)', fmtMoney(t.revenue), 'D2C ' + Math.round(t.d2c / 1000) + 'k &middot; B2B proiecte ' + Math.round(t.b2bProject / 1000) + 'k &middot; B2B altele ' + Math.round(t.b2bOther / 1000) + 'k' + (pnlPeriod === data.rows.length ? ' &middot; include luna curenta (estimat)' : '')) +
    statCard('Costuri totale', fmtMoney(t.cogs + t.marketing + t.salaries + t.taxes + t.other), 'COGS, marketing, salarii, taxe, altele', null, costsTooltip()) +
    statCard('Rezultat net', (t.net >= 0 ? '+' : '') + fmtMoney(t.net), 'profitabil doar datorita B2B', t.net >= 0 ? 'good' : 'bad');

  const mapped = ['COGS', 'Taxe', 'Salarii', 'Marketing'];
  // "Personal" (calatorii + cumparaturi card firma) nu e cost real de
  // business -- exclus DOAR pt Luna curenta (estimare), istoricul
  // (Toate/3/6 luni/Luna trecuta, facts din acte) il pastreaza neatins.
  const excludedCurrentMonth = ['Personal'];
  const leftoverRaw = data.categoryBreakdown.filter((c) => !mapped.some((m) => c.name.startsWith(m)) && !(isSingleMonth && excludedCurrentMonth.some((m) => c.name.startsWith(m))));
  const leftoverRawSum = leftoverRaw.reduce((s, c) => s + c.val, 0);
  // catSource e mereu derivat din t (totalurile perioadei selectate), deci
  // se actualizeaza cu orice filtru (Luna trecuta, 3/6 luni, Toate) --
  // COGS/Taxe/Salarii/Marketing vin direct din t; restul categoriilor
  // (Neclasificat, Chirie etc, care nu au defalcare lunara in date) sunt
  // scalate proportional la ponderea lor originala pe tot intervalul, ca
  // suma exacta sa dea t.other pt perioada selectata.
  const catSource = data.categoryBreakdown
    .filter((c) => !(isSingleMonth && excludedCurrentMonth.some((m) => c.name.startsWith(m))))
    .map((c) => {
      if (c.name.startsWith('COGS')) return { name: isSingleMonth ? 'COGS (marfa/materiale, fara proiecte)' : c.name, val: t.cogs };
      if (c.name.startsWith('Taxe')) return { name: c.name, val: t.taxes };
      if (c.name.startsWith('Salarii')) return { name: c.name, val: t.salaries };
      if (c.name.startsWith('Marketing')) return { name: c.name, val: t.marketing };
      return { name: c.name, val: t.other * (c.val / leftoverRawSum) };
    });
  const maxCat = Math.max(...catSource.map((c) => c.val));
  const catTotal = catSource.reduce((s, c) => s + c.val, 0);
  const catTotalRow =
    '<div class="item" style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)">' +
      '<div style="flex:0 0 220px;font-weight:700">Total</div>' +
      '<div style="flex:1;margin:0 12px"></div>' +
      '<div class="item-hours" style="font-weight:700">' + fmtMoney(catTotal) + '</div>' +
    '</div>';
  const catRows = catSource.map((c) => (
    '<div class="item" style="margin-bottom:10px">' +
      '<div style="flex:0 0 220px" class="item-sub">' + escapeHtml(c.name) + '</div>' +
      '<div style="flex:1;background:var(--border);border-radius:5px;height:8px;overflow:hidden;margin:0 12px">' +
        '<div style="height:100%;border-radius:5px;background:var(--accent);width:' + (c.val / maxCat * 100).toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="item-hours">' + fmtMoney(c.val) + '</div>' +
    '</div>'
  )).join('');

  const projects = data.projectCosts;
  const projectCards = Object.entries(projects).map(([key, p]) => (
    '<div class="stat-card">' +
      '<div class="stat-label">' + escapeHtml(key) + '</div>' +
      '<div class="stat-value good">+' + fmtMoney(p.net) + '</div>' +
      '<div class="stat-sub">venit ' + fmtMoney(p.revenue) + ' &middot; cost ' + fmtMoney(p.cost) + '</div>' +
    '</div>'
  )).join('');

  const baselineCards = data.baseline.map((b) => (
    '<div class="card">' +
      '<div class="person-name" style="font-size:0.9rem">' + escapeHtml(b.name) + '</div>' +
      '<div class="item-sub" style="margin-bottom:10px">CIF ' + escapeHtml(b.cif) + '</div>' +
      '<div class="item"><span>Venituri 2023</span><span class="item-hours">' + fmtMoney(b.rev2023) + '</span></div>' +
      '<div class="item"><span>Rezultat 2023</span><span class="item-hours ' + (b.net2023 >= 0 ? '' : 'roas-bad') + '">' + (b.net2023 >= 0 ? '+' : '') + fmtMoney(b.net2023) + '</span></div>' +
      '<div class="item"><span>Venituri 2024</span><span class="item-hours">' + fmtMoney(b.rev2024) + '</span></div>' +
      '<div class="item"><span>Rezultat 2024</span><span class="item-hours ' + (b.net2024 >= 0 ? '' : 'roas-bad') + '">' + (b.net2024 >= 0 ? '+' : '') + fmtMoney(b.net2024) + '</span></div>' +
    '</div>'
  )).join('');

  root.innerHTML =
    (isSingleMonth ? '' : '<div class="meta" style="margin-bottom:16px">' + escapeHtml(data.period) + ' &middot; ' + escapeHtml(data.entities) + '</div>') +
    '<div class="period-filter">' + filterBtns + '</div>' +
    '<div class="stat-grid">' + stats + '</div>' +
    '<div class="section-title" style="margin-top:24px">Costuri pe categorii</div>' +
    (isSingleMonth
      ? '<div class="stat-sub" style="margin-bottom:12px">COGS medie 8 luni (fara cost proiecte B2B) &middot; restul categoriilor medie ultimele 4 luni (nu avem defalcare lunara reala pe categorii).</div>'
      : '<div class="stat-sub" style="margin-bottom:12px">Categoriile fara defalcare lunara reala (Neclasificat, Chirie etc) sunt scalate proportional cu ponderea lor pe tot intervalul.</div>') +
    '<div class="card">' + catTotalRow + catRows + '</div>' +
    (isSingleMonth ? '' :
      '<div class="section-title">Proiecte B2B (istoric)</div>' +
      '<div class="stat-grid">' + projectCards + '</div>'
    ) +
    (isSingleMonth ?
      '<div class="section-title">Proiecte B2B incoming</div>' +
      '<div id="incoming-projects-section"></div>' +
      '<div class="section-title">Estimare luna curenta</div>' +
      '<div id="month-estimate-section"></div>'
    : '') +
    (isSingleMonth ? '' :
      '<div class="section-title">Bilanturi oficiale ANAF (2023 vs 2024)</div>' +
      '<div class="grid-two" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">' + baselineCards + '</div>'
    );

  renderIncomingProjectsSection();
  renderMonthEstimateSection(data);
}

/** Computes recommendations live from whatever tabs actually loaded,
 * instead of a fixed static list -- each one only fires if the underlying
 * condition is actually true right now, and reads straight off the same
 * data the other tabs show (no separate/stale copy). Short by design: one
 * sentence of "what's happening", one of "so what to do". */
function computeRecommendations(prod, profit, pnl) {
  const items = [];

  if (profit && profit.days.length) {
    const days = profit.days;
    const rev = days.reduce((s, d) => s + d.revenue, 0);
    const cogs = days.reduce((s, d) => s + d.cogs, 0);
    const spend = days.reduce((s, d) => s + d.adSpend, 0);
    const negDays = days.filter((d) => d.netProfit < 0).length;
    const adPct = rev > 0 ? (spend / rev) * 100 : 0;
    const cogsPct = rev > 0 ? (cogs / rev) * 100 : 0;
    const avgRoas = spend > 0 ? rev / spend : null;

    if (adPct > 25) {
      items.push({
        title: 'Ads consuma ' + adPct.toFixed(0) + '% din venit (ultimele ' + days.length + ' zile)',
        body: 'Peste pragul sanatos de 15-20%. Verifica tab Profit &amp; ROAS -> Campanii si opreste campaniile cu ROAS sub 2x.',
      });
    }
    if (avgRoas != null && avgRoas < 3) {
      items.push({
        title: 'ROAS mediu real: ' + avgRoas.toFixed(2) + '&times;',
        body: 'Sub 3x e strans dupa ce scazi si costul de productie. Compara campaniile individual, nu doar media.',
      });
    }
    if (negDays > 0) {
      items.push({
        title: negDays + ' din ' + days.length + ' zile au fost pe pierdere neta',
        body: 'Vezi tab Profit &amp; ROAS pt zilele exacte -- cauta ce au avut diferit (spend mare, venit mic).',
      });
    }
    if (cogsPct > 0 && cogsPct < 55) {
      items.push({
        title: 'Marja de productie e sanatoasa (~' + (100 - cogsPct).toFixed(0) + '%)',
        body: 'Costul marfii nu e problema -- volumul de vanzari conteaza mai mult decat taierea COGS.',
      });
    }
  }

  if (prod) {
    const backlogH = prod.backlog?.hours || 0;
    const feliciaLoad = prod.felicia ? prod.felicia.hours / prod.felicia.capacity : 0;
    const floriLoad = prod.flori ? prod.flori.hours / prod.flori.capacity : 0;
    if (backlogH > 8) {
      items.push({
        title: backlogH.toFixed(1) + 'h de comenzi reale nu au incaput azi',
        body: 'Presiune de capacitate in crestere -- vezi tab Productie -> Comenzi in asteptare.',
      });
    }
    if (feliciaLoad >= 1 || floriLoad >= 1) {
      items.push({
        title: 'Felicia sau Flori sunt la capacitate maxima azi',
        body: 'Orice comanda noua de azi risca sa treaca pe maine.',
      });
    }
  }

  if (pnl) {
    items.push({
      title: 'Fara proiecte B2B, magazinul e pe pierdere (P&amp;L ' + escapeHtml(pnl.period) + ')',
      body: 'Rezultat fara B2B: ' + fmtMoney(pnl.withoutB2B) + '. Proiectele B2B raman singurul motor de profit constant -- vezi tab P&amp;L.',
    });
    const adPctPnl = pnl.totals.d2c > 0 ? (pnl.totals.marketing / pnl.totals.d2c) * 100 : 0;
    if (adPctPnl > 25) {
      items.push({
        title: 'Marketing = ' + adPctPnl.toFixed(0) + '% din venitul D2C pe tot intervalul P&amp;L',
        body: 'Consistent peste pragul sanatos -- confirma semnalul din datele recente de mai sus.',
      });
    }
  }

  return items;
}

function renderReco(prod, profit, pnl, root) {
  const items = computeRecommendations(prod, profit, pnl);
  if (!items.length) {
    root.innerHTML = '<div class="empty">Nimic de semnalat momentan -- cifrele arata normal.</div>';
    return;
  }
  const html = items.map((it, i) => (
    '<div class="reco">' +
      '<div class="reco-num">' + (i + 1) + '</div>' +
      '<div class="reco-body"><h4>' + it.title + '</h4><p>' + it.body + '</p></div>' +
    '</div>'
  )).join('');
  root.innerHTML =
    '<div class="meta" style="margin-bottom:16px">Calculat live din tab-urile Productie, Profit &amp; ROAS si P&amp;L</div>' +
    '<div class="reco-list">' + html + '</div>';
}

// ---- Proiecte B2B incoming (persistat local in browser -- pagina e statica,
// fara backend/baza de date; datele raman doar pe acest device/browser). ----
const LS_PROJECTS_KEY = 'mys_pnl_incoming_projects';
const LS_ESTIMATE_KEY = 'mys_pnl_month_estimate_v2'; // v2: defaults au trecut de la "ultima luna" la "medie fara B2B" -- cheie noua ca sa nu ramana valori vechi persistente in localStorage nesincronizate

function loadIncomingProjects() {
  try { return JSON.parse(localStorage.getItem(LS_PROJECTS_KEY)) || []; } catch (e) { return []; }
}
function saveIncomingProjects(list) {
  localStorage.setItem(LS_PROJECTS_KEY, JSON.stringify(list));
}
function addIncomingProject() {
  const name = document.getElementById('proj-name').value.trim();
  const amount = Number(document.getElementById('proj-amount').value);
  const month = document.getElementById('proj-month').value.trim();
  const status = document.getElementById('proj-status').value;
  if (!name || !amount) return;
  const list = loadIncomingProjects();
  list.push({ id: Date.now(), name, amount, month: month || '-', status });
  saveIncomingProjects(list);
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-amount').value = '';
  document.getElementById('proj-month').value = '';
  renderPnlPeriod(document.getElementById('root-pnl'));
}
function removeIncomingProject(id) {
  saveIncomingProjects(loadIncomingProjects().filter((p) => p.id !== id));
  renderPnlPeriod(document.getElementById('root-pnl'));
}

function renderIncomingProjectsSection() {
  const el = document.getElementById('incoming-projects-section');
  if (!el) return;
  const list = loadIncomingProjects();
  const total = list.reduce((s, p) => s + p.amount, 0);
  const rows = list.length
    ? list.map((p) => (
        '<div class="proj-row"><span>' + escapeHtml(p.name) +
          '<span class="status-chip ' + p.status + '">' + (p.status === 'confirmat' ? 'confirmat' : 'probabil') + '</span>' +
          (p.month !== '-' ? '<div class="item-sub">' + escapeHtml(p.month) + '</div>' : '') +
        '</span><span style="display:flex;align-items:center;gap:10px">' +
          '<span class="item-hours">' + fmtMoney(p.amount) + '</span>' +
          '<button class="proj-remove" onclick="removeIncomingProject(' + p.id + ')" title="Sterge">&times;</button>' +
        '</span></div>'
      )).join('')
    : '<div class="empty">Niciun proiect adaugat inca.</div>';

  el.innerHTML =
    '<div class="card">' +
      '<div class="block-header"><h2>Total incoming</h2><span class="total">' + fmtMoney(total) + '</span></div>' +
      rows +
      '<div class="form-row" style="margin-top:14px">' +
        '<input class="form-input" id="proj-name" placeholder="Nume proiect" style="flex:1;min-width:140px">' +
        '<input class="form-input" id="proj-amount" type="number" placeholder="Venit estimat (RON)" style="width:170px">' +
        '<input class="form-input" id="proj-month" placeholder="Luna (ex: Sep 2026)" style="width:150px">' +
        '<select class="form-select" id="proj-status"><option value="probabil">Probabil</option><option value="confirmat">Confirmat</option></select>' +
        '<button class="push-btn" onclick="addIncomingProject()">Adauga</button>' +
      '</div>' +
      '<div class="storage-note">Salvat local, doar in acest browser -- nu e sincronizat intre device-uri.</div>' +
    '</div>';
}

function loadEstimate(defaults) {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_ESTIMATE_KEY));
    if (saved) return { ...defaults, ...saved };
  } catch (e) {}
  return defaults;
}
function saveEstimateAndRecalc() {
  const fields = ['d2c', 'cogs', 'marketing', 'salaries', 'taxes', 'other'];
  const est = {};
  for (const f of fields) est[f] = Number(document.getElementById('est-' + f).value) || 0;
  localStorage.setItem(LS_ESTIMATE_KEY, JSON.stringify(est));
  est.b2bOther = Number(document.getElementById('est-b2bOther').value) || 0;
  updateEstimateNet(est);
}
function resetEstimate() {
  localStorage.removeItem(LS_ESTIMATE_KEY);
  renderMonthEstimateSection(pnlDataCache);
}
function updateEstimateNet(est) {
  const revenue = est.d2c + (est.b2bOther || 0);
  const costs = est.cogs + est.marketing + est.salaries + est.taxes + est.other;
  const net = revenue - costs;
  const netEl = document.getElementById('estimate-net-value');
  if (netEl) {
    netEl.textContent = (net >= 0 ? '+' : '') + fmtMoney(net);
    netEl.className = 'stat-value ' + (net >= 0 ? 'good' : 'bad');
  }
  const revEl = document.getElementById('estimate-revenue-value');
  if (revEl) revEl.textContent = fmtMoney(revenue) + ' (D2C ' + fmtMoney(est.d2c) + ' + B2B ' + fmtMoney(est.b2bOther || 0) + ')';
}

function renderMonthEstimateSection(pnlData) {
  const el = document.getElementById('month-estimate-section');
  if (!el || !pnlData) return;
  const round2 = (n) => Math.round(n * 100) / 100;
  const avg = computeBaselineAverage(pnlData);
  const runRate = computeCurrentMonthRunRate();
  const incomingTotal = loadIncomingProjects().reduce((s, p) => s + p.amount, 0);
  const defaults = {
    d2c: round2(runRate ? runRate.projected : avg.d2c), b2bOther: round2(incomingTotal), cogs: round2(avg.cogs), marketing: round2(avg.marketing),
    salaries: round2(avg.salaries), taxes: round2(avg.taxes), other: round2(avg.other),
  };
  const est = loadEstimate(defaults);
  est.b2bOther = round2(incomingTotal);
  const now = new Date();
  const monthName = now.toLocaleDateString('ro-RO', { month: 'long', year: 'numeric' });

  const field = (key, label) => (
    '<div class="estimate-field"><label>' + label + '</label>' +
    '<input class="form-input" id="est-' + key + '" type="number" value="' + est[key] + '" oninput="saveEstimateAndRecalc()"></div>'
  );

  el.innerHTML =
    '<div class="card">' +
      '<div class="stat-sub" style="margin-bottom:14px">' + monthName + ' -- editabil. Venit D2C = vanzari reale de pana acum, proiectat pe luna intreaga. COGS = medie pe ' + pnlData.rows.length + ' luni (fara costul proiectelor B2B); restul costurilor = medie ultimele 4 luni. Venitul B2B porneste automat din totalul "Proiecte B2B incoming" de mai sus, dar poti suprascrie manual orice camp.</div>' +
      '<div class="estimate-grid">' +
        field('d2c', 'Venit D2C estimat') +
        field('b2bOther', 'Venit B2B estimat') +
        field('cogs', 'COGS estimat') +
        field('marketing', 'Marketing estimat') +
        field('salaries', 'Salarii estimate') +
        field('taxes', 'Taxe estimate') +
        field('other', 'Altele estimate') +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="stat-label">Venit total estimat</div><div class="stat-value" id="estimate-revenue-value" style="font-size:1rem"></div></div>' +
        '<div class="stat-card"><div class="stat-label">Rezultat net estimat</div><div class="stat-value" id="estimate-net-value"></div></div>' +
      '</div>' +
      '<div class="storage-note">Salvat local, doar in acest browser. <a href="#" onclick="resetEstimate();return false;" style="color:var(--accent)">Reseteaza la valorile implicite</a></div>' +
    '</div>';
  updateEstimateNet(est);
}

let settingsDataCache = null;

function groupSettingsByCategory(products) {
  const byCategory = new Map();
  for (const p of products) {
    const entry = byCategory.get(p.category) || { category: p.category, hours: p.hours, count: 0, costSum: 0, costCount: 0, actualCount: 0 };
    entry.count += 1;
    if (p.cost != null) { entry.costSum += p.cost; entry.costCount += 1; }
    if (p.costSource === 'actual') entry.actualCount += 1;
    byCategory.set(p.category, entry);
  }
  return [...byCategory.values()]
    .map((e) => ({
      category: e.category,
      hours: e.hours,
      count: e.count,
      avgCost: e.costCount > 0 ? e.costSum / e.costCount : null,
      allActual: e.actualCount === e.count,
    }))
    .sort((a, b) => a.category.localeCompare(b.category));
}

function renderSettings(data, root) {
  settingsDataCache = data;
  const unknownCount = data.products.filter((p) => p.costSource === 'unknown').length;
  root.innerHTML =
    '<div class="meta" style="margin-bottom:12px">' + data.products.length + ' produse active &middot; generat ' + fmtDateTime(data.generatedAt) +
      (unknownCount > 0 ? ' &middot; <span style="color:var(--warn)">' + unknownCount + ' fara cost cunoscut</span>' : '') +
    '</div>' +
    '<div class="form-row" style="margin-bottom:16px">' +
      '<input class="form-input" id="settings-search" placeholder="Cauta categorie..." style="flex:1;min-width:220px" oninput="filterSettings()">' +
    '</div>' +
    '<div class="card table-scroll"><table class="trend" id="settings-table">' +
      '<thead><tr><th>Categorie</th><th>Produse</th><th>Timp productie</th><th>Cost mediu</th><th>Sursa cost</th></tr></thead>' +
      '<tbody id="settings-tbody"></tbody>' +
    '</table></div>';
  filterSettings();
}

function filterSettings() {
  const q = (document.getElementById('settings-search')?.value || '').toLowerCase();
  const tbody = document.getElementById('settings-tbody');
  if (!tbody || !settingsDataCache) return;
  const categories = groupSettingsByCategory(settingsDataCache.products);
  const filtered = categories.filter((c) => !q || c.category.toLowerCase().includes(q));
  tbody.innerHTML = filtered.length
    ? filtered.map((c) => (
        '<tr>' +
          '<td data-label="Categorie" style="text-align:left">' + escapeHtml(c.category) + '</td>' +
          '<td data-label="Produse">' + c.count + '</td>' +
          '<td data-label="Timp productie">' + (c.hours != null ? c.hours.toFixed(2) + 'h' : 'n/a') + '</td>' +
          '<td data-label="Cost mediu">' + (c.avgCost != null ? fmtMoney(c.avgCost) : 'n/a') + '</td>' +
          '<td data-label="Sursa cost"><span class="status-chip ' + (c.allActual ? 'confirmat' : 'probabil') + '">' +
            (c.allActual ? 'real' : 'partial estimat') +
          '</span></td>' +
        '</tr>'
      )).join('')
    : '<tr><td colspan="5"><div class="empty">Nicio categorie gasita.</div></td></tr>';
}

load();
