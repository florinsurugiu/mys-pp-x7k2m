<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mysimplicated — Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #14161a;
    --bg-elevated: #1c1f25;
    --border: #2a2e36;
    --text: #eceef1;
    --text-dim: #9aa1ad;
    --text-faint: #656d7a;
    --accent: #5fc2c9;
    --accent-dim: #2f4d50;
    --good: #6fbf73;
    --warn: #e0b355;
    --bad: #e0705f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f4f1;
      --bg-elevated: #ffffff;
      --border: #e2e0da;
      --text: #1d1f23;
      --text-dim: #5b5f68;
      --text-faint: #90949c;
      --accent: #1f8790;
      --accent-dim: #d8eeef;
      --good: #2f8f3a;
      --warn: #a1720f;
      --bad: #b8422f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-elevated: #1c1f25; --border: #2a2e36;
    --text: #eceef1; --text-dim: #9aa1ad; --text-faint: #656d7a;
    --accent: #5fc2c9; --accent-dim: #2f4d50;
    --good: #6fbf73; --warn: #e0b355; --bad: #e0705f;
  }
  :root[data-theme="light"] {
    --bg: #f5f4f1; --bg-elevated: #ffffff; --border: #e2e0da;
    --text: #1d1f23; --text-dim: #5b5f68; --text-faint: #90949c;
    --accent: #1f8790; --accent-dim: #d8eeef;
    --good: #2f8f3a; --warn: #a1720f; --bad: #b8422f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 28px; }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .meta { font-size: 0.8rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .meta strong { color: var(--text-dim); font-weight: 600; }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 640px) { .grid-two { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-faint); font-weight: 700; margin: 0 0 12px;
  }
  .person-name { font-size: 1.05rem; font-weight: 700; }
  .hours-row { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 10px; }
  .hours-val { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hours-cap { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; margin-bottom: 14px; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .3s; }
  .bar.warn > span { background: var(--warn); }
  .bar.over > span { background: var(--bad); }

  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 0.86rem; }
  .item-title { color: var(--text); }
  .item-sub { color: var(--text-faint); font-size: 0.76rem; }
  .item-hours { font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
    vertical-align: middle;
  }
  .badge.predicted { background: var(--accent-dim); color: var(--accent); }

  section.block { margin-bottom: 20px; }
  .block-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .block-header h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .block-header .total { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .backlog-list { display: flex; flex-direction: column; gap: 0; }
  .backlog-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .backlog-row:last-child { border-bottom: none; }
  .order-tag { font-variant-numeric: tabular-nums; color: var(--text-faint); font-size: 0.76rem; margin-right: 6px; }

  .empty { color: var(--text-faint); font-size: 0.85rem; padding: 6px 0; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .error { color: var(--bad); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 0.88rem; color: var(--text-faint);
    padding: 10px 4px; margin-right: 20px; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .push-btn {
    appearance: none; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent);
    font: inherit; font-weight: 700; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px;
    cursor: pointer; transition: opacity .15s;
  }
  .push-btn:hover { opacity: 0.85; }

  .period-filter { display: flex; gap: 8px; margin-bottom: 16px; }
  .period-btn {
    appearance: none; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-dim);
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all .15s;
  }
  .period-btn:hover { color: var(--text); }
  .period-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stat-value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.good { color: var(--good); }
  .stat-value.bad { color: var(--bad); }
  .stat-sub { font-size: 0.72rem; color: var(--text-faint); margin-top: 2px; font-variant-numeric: tabular-nums; }

  table.trend { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.trend th, table.trend td { text-align: right; padding: 8px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.trend th:first-child, table.trend td:first-child { text-align: left; }
  table.trend th { color: var(--text-faint); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  table.trend td { border-bottom: 1px solid var(--border); }
  table.trend tr:last-child td { border-bottom: none; }
  table.trend .roas-good { color: var(--good); }
  table.trend .roas-bad { color: var(--bad); }
  table.trend .totals-row td { font-weight: 700; border-bottom: 2px solid var(--border); }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mysimplicated Dashboard</h1>
    <div class="meta" id="meta">se incarca...</div>
  </header>
  <div class="tabs">
    <button class="tab-btn active" data-tab="production">Productie</button>
    <button class="tab-btn" data-tab="profit">Profit &amp; ROAS</button>
  </div>
  <div class="tab-panel active" id="panel-production">
    <div id="root-production">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-profit">
    <div id="root-profit">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
</div>
<script>
async function load() {
  const rootProduction = document.getElementById('root-production');
  const rootProfit = document.getElementById('root-profit');
  const meta = document.getElementById('meta');
  const metaParts = [];

  try {
    const res = await fetch('dashboard-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    renderProduction(data, rootProduction);
    metaParts.push('productie: plan pt <strong>' + fmtDate(data.planDate) + '</strong>, generat ' + fmtDateTime(data.generatedAt));
  } catch (e) {
    rootProduction.innerHTML = '<div class="error">Nu am putut incarca datele de productie (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('profit-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    renderProfit(data, rootProfit);
    metaParts.push('profit: generat ' + fmtDateTime(data.generatedAt));
  } catch (e) {
    rootProfit.innerHTML = '<div class="error">Nu am putut incarca datele de profit (' + e.message + ').</div>';
  }

  meta.innerHTML = metaParts.join(' &middot; ');
}

function initTabs() {
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach((btn) => {
    btn.addEventListener('click', () => {
      buttons.forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function pushToAsana() {
  const ok = window.confirm('Sigur vrei sa publici planul de azi pe Asana? Se vor crea task-uri reale pentru Carl, Felicia si Flori.');
  if (!ok) return;
  window.open(
    'https://github.com/florinsurugiu/mysimplicated-theme/actions/workflows/production-planning.yml',
    '_blank'
  );
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'long' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ro-RO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function barClass(hours, capacity) {
  const ratio = hours / capacity;
  if (ratio > 1.02) return 'over';
  if (ratio > 0.92) return 'warn';
  return '';
}
function sourceBadge(source) {
  if (source === 'predicted') return '<span class="badge predicted">predictie</span>';
  return '';
}

function personCard(name, person) {
  const cls = barClass(person.hours, person.capacity);
  const pct = Math.min(100, (person.hours / person.capacity) * 100);
  const items = person.items.length
    ? person.items.map((it) => (
        '<li class="item">' +
          '<div><div class="item-title">' + escapeHtml(it.title) + sourceBadge(it.source) + '</div>' +
          '<div class="item-sub">' + escapeHtml(it.category) + ' &middot; ' + escapeHtml(it.sizes) + '</div></div>' +
          '<div class="item-hours">' + it.hours.toFixed(2).replace('.', ',') + 'h</div>' +
        '</li>'
      )).join('')
    : '<div class="empty">Fara task-uri.</div>';
  return (
    '<div class="card">' +
      '<div class="person-name">' + name + '</div>' +
      '<div class="hours-row"><span class="hours-val">' + person.hours.toFixed(2).replace('.', ',') + 'h</span>' +
      '<span class="hours-cap">/ ' + person.capacity + 'h</span></div>' +
      '<div class="bar ' + cls + '"><span style="width:' + pct + '%"></span></div>' +
      '<ul class="items">' + items + '</ul>' +
    '</div>'
  );
}

function croitSection(croit) {
  const rows = croit.length
    ? croit.map((t) => (
        '<div class="backlog-row"><span>' +
          (t.orderName ? '<span class="order-tag">' + escapeHtml(t.orderName) + '</span>' : '') +
          escapeHtml(t.name) +
          (t.category ? '<div class="item-sub">' + escapeHtml(t.category) + '</div>' : '') +
        '</span></div>'
      )).join('')
    : '<div class="empty">Nimic in coada -- Carl e la zi.</div>';
  return (
    '<section class="block card">' +
      '<div class="block-header"><h2>Croit (Carl) -- ' + croit.length + ' in asteptare</h2></div>' +
      '<div class="backlog-list">' + rows + '</div>' +
    '</section>'
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderProduction(data, root) {
  const backlogItems = data.backlog.items.length
    ? data.backlog.items.map((it) => (
        '<div class="backlog-row"><span><span class="order-tag">' + escapeHtml(it.orderName) + '</span>' +
        escapeHtml(it.title) +
        (it.category ? '<div class="item-sub">' + escapeHtml(it.category) + '</div>' : '') +
        '</span><span class="item-hours">' + it.hours.toFixed(2).replace('.', ',') + 'h</span></div>'
      )).join('')
    : '<div class="empty">Nimic in asteptare -- toate comenzile reale au incaput azi.</div>';

  root.innerHTML =
    '<div style="display:flex;justify-content:flex-end;margin-bottom:16px">' +
      '<button class="push-btn" onclick="pushToAsana()">Publica pe Asana</button>' +
    '</div>' +
    '<div class="grid-two">' +
      personCard('Felicia', data.felicia) +
      personCard('Flori', data.flori) +
    '</div>' +
    croitSection(data.croit || []) +
    '<section class="block card">' +
      '<div class="block-header"><h2>Comenzi in asteptare (nu au incaput azi)</h2>' +
      '<span class="total">' + data.backlog.hours.toFixed(2).replace('.', ',') + 'h</span></div>' +
      '<div class="backlog-list">' + backlogItems + '</div>' +
    '</section>';
}

function fmtMoney(n) {
  return n.toLocaleString('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' RON';
}

let profitDataCache = null;
let profitPeriod = 14;

function renderProfit(data, root) {
  profitDataCache = data;
  renderProfitPeriod(root);
}

function setProfitPeriod(days, root) {
  profitPeriod = days;
  renderProfitPeriod(root || document.getElementById('root-profit'));
}

function renderProfitPeriod(root) {
  const data = profitDataCache;
  const allDays = data.days;
  if (!allDays.length) {
    root.innerHTML = '<div class="empty">Nicio zi cu date inca.</div>';
    return;
  }
  const periodOptions = [7, 14, 30];
  const filterBtns = periodOptions.map((p) => (
    '<button class="period-btn' + (p === profitPeriod ? ' active' : '') + '" onclick="setProfitPeriod(' + p + ')">' + p + ' zile</button>'
  )).join('');
  const days = allDays.slice(-profitPeriod);
  const latest = days[days.length - 1];
  const totalRevenue = days.reduce((s, d) => s + d.revenue, 0);
  const totalCogs = days.reduce((s, d) => s + d.cogs, 0);
  const totalSpend = days.reduce((s, d) => s + d.adSpend, 0);
  const totalNetProfit = days.reduce((s, d) => s + d.netProfit, 0);
  const avgRoas = totalSpend > 0 ? totalRevenue / totalSpend : null;

  const statCard = (label, value, sub, cls) =>
    '<div class="stat-card"><div class="stat-label">' + label + '</div>' +
    '<div class="stat-value' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';

  const stats =
    statCard('Profit net azi', fmtMoney(latest.netProfit), 'ROAS ' + (latest.roas ?? 'n/a'), latest.netProfit >= 0 ? 'good' : 'bad') +
    statCard('ROAS azi', latest.roas != null ? latest.roas.toFixed(2) + '&times;' : 'n/a', 'venit ' + fmtMoney(latest.revenue) + ' / cheltuit ' + fmtMoney(latest.adSpend)) +
    statCard('Profit net (' + days.length + ' zile)', fmtMoney(totalNetProfit), null, totalNetProfit >= 0 ? 'good' : 'bad') +
    statCard('ROAS mediu (' + days.length + ' zile)', avgRoas != null ? avgRoas.toFixed(2) + '&times;' : 'n/a', 'venit total ' + fmtMoney(totalRevenue));

  const rows = [...days].reverse().map((d) => {
    const roasCls = d.roas == null ? '' : d.roas >= 4 ? 'roas-good' : d.roas < 2 ? 'roas-bad' : '';
    return (
      '<tr>' +
        '<td>' + fmtDate(d.date) + '</td>' +
        '<td>' + fmtMoney(d.revenue) + '</td>' +
        '<td>' + fmtMoney(d.cogs) + '</td>' +
        '<td>' + fmtMoney(d.adSpend) + '</td>' +
        '<td class="' + (d.netProfit >= 0 ? '' : 'roas-bad') + '">' + fmtMoney(d.netProfit) + '</td>' +
        '<td class="' + roasCls + '">' + (d.roas != null ? d.roas.toFixed(2) + '&times;' : 'n/a') + '</td>' +
      '</tr>'
    );
  }).join('');

  const totalRoasCls = avgRoas == null ? '' : avgRoas >= 4 ? 'roas-good' : avgRoas < 2 ? 'roas-bad' : '';
  const totalsRow =
    '<tr class="totals-row">' +
      '<td>Total (' + days.length + ' zile)</td>' +
      '<td>' + fmtMoney(totalRevenue) + '</td>' +
      '<td>' + fmtMoney(totalCogs) + '</td>' +
      '<td>' + fmtMoney(totalSpend) + '</td>' +
      '<td class="' + (totalNetProfit >= 0 ? '' : 'roas-bad') + '">' + fmtMoney(totalNetProfit) + '</td>' +
      '<td class="' + totalRoasCls + '">' + (avgRoas != null ? avgRoas.toFixed(2) + '&times;' : 'n/a') + '</td>' +
    '</tr>';

  root.innerHTML =
    '<div class="period-filter">' + filterBtns + '</div>' +
    '<div class="stat-grid">' + stats + '</div>' +
    '<div class="card table-scroll"><table class="trend">' +
      '<thead><tr><th>Zi</th><th>Venit</th><th>Cost productie</th><th>Cheltuit ads</th><th>Profit net</th><th>ROAS</th></tr></thead>' +
      '<tbody>' + totalsRow + rows + '</tbody>' +
    '</table></div>';
}

initTabs();
load();
</script>
</body>
</html>
