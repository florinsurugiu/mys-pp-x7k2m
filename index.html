<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY Dashboard</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #14161a;
    --bg-elevated: #1c1f25;
    --border: #2a2e36;
    --text: #eceef1;
    --text-dim: #9aa1ad;
    --text-faint: #656d7a;
    --accent: #5fc2c9;
    --accent-dim: #2f4d50;
    --good: #6fbf73;
    --warn: #e0b355;
    --bad: #e0705f;
    --icon-shade: 0%;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f4f1;
      --bg-elevated: #ffffff;
      --border: #e2e0da;
      --text: #1d1f23;
      --text-dim: #5b5f68;
      --text-faint: #90949c;
      --accent: #1f8790;
      --accent-dim: #d8eeef;
      --good: #2f8f3a;
      --warn: #a1720f;
      --bad: #b8422f;
      --icon-shade: 38%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-elevated: #1c1f25; --border: #2a2e36;
    --text: #eceef1; --text-dim: #9aa1ad; --text-faint: #656d7a;
    --accent: #5fc2c9; --accent-dim: #2f4d50;
    --good: #6fbf73; --warn: #e0b355; --bad: #e0705f; --icon-shade: 0%;
  }
  :root[data-theme="light"] {
    --bg: #f5f4f1; --bg-elevated: #ffffff; --border: #e2e0da;
    --text: #1d1f23; --text-dim: #5b5f68; --text-faint: #90949c;
    --accent: #1f8790; --accent-dim: #d8eeef;
    --good: #2f8f3a; --warn: #a1720f; --bad: #b8422f; --icon-shade: 38%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }
  header { margin-bottom: 24px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h1.brand { display: flex; align-items: center; line-height: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand-logo { display: block; height: 22px; aspect-ratio: 2233 / 415; background: var(--text); -webkit-mask: url(logo.png) center / contain no-repeat; mask: url(logo.png) center / contain no-repeat; }
  .meta { font-size: 0.8rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-pill { font-size: 0.72rem; color: var(--text-faint); font-variant-numeric: tabular-nums; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .meta-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .meta strong { color: var(--text-dim); font-weight: 600; }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 640px) { .grid-two { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-faint); font-weight: 700; margin: 0 0 12px;
  }
  .person-name { font-size: 1.05rem; font-weight: 700; }
  .hours-row { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 10px; }
  .hours-val { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hours-cap { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; margin-bottom: 14px; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .3s; }
  .bar.warn > span { background: var(--warn); }
  .bar.over > span { background: var(--bad); }

  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; padding: 5px 0; }
  .item-title { color: var(--text); flex: 1; text-align: left; }
  .item-sub { color: var(--text-faint); font-size: 0.76rem; }
  .item-hours { font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .delete-btn {
    appearance: none; border: none; background: none; color: var(--text-faint);
    font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 2px 6px; flex: 0 0 auto;
    border-radius: 6px;
  }
  .delete-btn:hover { color: var(--danger, #e05252); background: rgba(224,82,82,0.12); }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-left: 6px;
    vertical-align: middle; line-height: 1;
  }
  .badge svg { display: block; width: 13px; height: 13px; overflow: visible; }
  /* asanaPrefixBadge places this badge before the task number instead of
     after the name -- margin-left (for the normal trailing position)
     leaves no gap before the number that follows it, so flip the gap. */
  .badge-prefix { margin-left: 0; margin-right: 6px; }
  .badge.predicted { background: var(--accent-dim); color: var(--accent); }
  .badge.leftover { background: none; }
  .badge.wb { background: rgba(120, 130, 250, 0.16); color: #9aa3ff; }
  .badge.shopify { background: rgba(120, 220, 150, 0.16); color: #7bd99a; }
  .badge.buffer { background: rgba(160, 165, 175, 0.18); color: var(--text-dim); }

  .drag-handle {
    align-self: center; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    width: 18px; height: 20px; color: var(--text-faint); cursor: grab; border-radius: 4px;
    transition: background .15s, color .15s;
  }
  .drag-handle:hover { background: var(--bg-elevated); color: var(--text-dim); }
  .drag-handle:active { cursor: grabbing; }
  .item.dragging { opacity: 0.35; }
  /* Doar linia (fara margin) -- schimbarea marginii randului peste care
     esti ii schimba propriul getBoundingClientRect, care la randul lui
     recalculeaza before/after la urmatorul dragover (fara sa se fi miscat
     cursorul deloc) -- bucla asta cauza glitch-ul sus/jos. Linia, fiind
     position:absolute, nu afecteaza deloc layout-ul/marimea randului. */
  .item, .backlog-row.item { position: relative; }
  .drop-before::before {
    content: ''; position: absolute; top: -5px; left: 0; right: 0; height: 2px;
    background: var(--accent); border-radius: 2px; box-shadow: 0 0 6px var(--accent);
  }
  .drop-after::after {
    content: ''; position: absolute; bottom: -5px; left: 0; right: 0; height: 2px;
    background: var(--accent); border-radius: 2px; box-shadow: 0 0 6px var(--accent);
  }
  .item-flash { animation: item-flash-kf .6s ease; border-radius: 6px; }
  @keyframes item-flash-kf {
    0% { background: var(--accent-dim); }
    100% { background: transparent; }
  }
  .plan-toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; flex-wrap: nowrap; }
  @media (max-width: 480px) {
    .plan-toolbar { justify-content: space-between; }
    .plan-toolbar .plan-btn, .plan-toolbar .push-btn { flex: 1 1 0; padding-left: 6px; padding-right: 6px; }
  }
  .plan-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
  }
  .plan-btn:hover { color: var(--text); border-color: var(--accent); }

  section.block { margin-bottom: 20px; }
  .block-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .block-header h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .block-header .total { font-size: 0.85rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .backlog-list { display: flex; flex-direction: column; gap: 0; }
  .backlog-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .backlog-row:last-child { border-bottom: none; }
  .order-tag { font-variant-numeric: tabular-nums; color: var(--text-faint); font-size: 0.76rem; flex: 0 0 76px; padding-top: 1px; }
  .order-tag-popup { cursor: pointer; text-decoration: underline dotted; padding: 6px 4px; margin: -6px -4px; display: inline-block; }
  .backlog-main { flex: 1; min-width: 0; }

  .empty { color: var(--text-faint); font-size: 0.85rem; padding: 6px 0; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .error { color: var(--bad); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 0.88rem; color: var(--text-faint);
    padding: 10px 4px; margin-right: 20px; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  @media (max-width: 640px) {
    .tab-btn { margin-right: 10px; font-size: 0.8rem; padding: 8px 2px; }
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .icon-btn {
    width: 30px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; line-height: 1; background: var(--bg-elevated); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.spinning { animation: icon-spin .6s linear; }
  @keyframes icon-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .settings-btn.active { background: var(--accent-dim); border-color: var(--accent); }

  .order-popup-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .order-popup {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; min-width: 200px; max-width: 320px;
  }
  .order-popup-row { padding: 6px 0; font-size: 0.95rem; }
  .order-popup-row + .order-popup-row { border-top: 1px solid var(--border); }

  .push-btn {
    appearance: none; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent);
    font: inherit; font-weight: 700; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px;
    cursor: pointer; transition: opacity .15s;
  }
  .push-btn:hover { opacity: 0.85; }

  .reco-list { display: flex; flex-direction: column; gap: 12px; }
  .reco { display: flex; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .reco .reco-num { font-size: 1.3rem; font-weight: 700; color: var(--accent); flex: 0 0 auto; width: 26px; }
  .reco .reco-body h4 { margin: 0 0 6px; font-size: 0.92rem; font-weight: 700; }
  .reco .reco-body p { margin: 0; font-size: 0.85rem; color: var(--text-dim); line-height: 1.55; }

  .period-filter { display: flex; gap: 8px; margin-bottom: 16px; }
  .period-btn {
    appearance: none; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-dim);
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all .15s;
  }
  .period-btn:hover { color: var(--text); }
  .period-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form-input, .form-select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 0.85rem; padding: 8px 10px; border-radius: 6px;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
  .proj-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .proj-row:last-child { border-bottom: none; }
  .proj-remove {
    appearance: none; border: none; background: none; color: var(--text-faint);
    cursor: pointer; font-size: 0.9rem; padding: 2px 6px;
  }
  .proj-remove:hover { color: var(--bad); }
  .status-chip { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 20px; font-weight: 700; margin-left: 8px; }
  .status-chip.confirmat { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
  .status-chip.probabil { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .estimate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .estimate-field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .estimate-field .form-input { width: 100%; }
  .storage-note { font-size: 0.74rem; color: var(--text-faint); margin-top: 10px; }

  .cash-card { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
  .cash-card:hover { border-color: var(--accent); }
  .cash-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cash-calc-link { font-size: 0.72rem; color: var(--accent); margin-top: 6px; }
  .cash-sub-total { display: block; font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0.85; margin-top: 2px; }
  .tot-box { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); padding: 16px 18px; margin-bottom: 16px; }
  .tot-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; }
  .tot-value { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
  .tot-box.good .tot-value { color: var(--good); }
  .tot-box.bad .tot-value { color: var(--bad); }
  ul.tot-parts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  ul.tot-parts li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 0.88rem; color: var(--text-dim); border-bottom: 1px dashed var(--border); }
  ul.tot-parts li:last-child { border-bottom: none; }
  ul.tot-parts li span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); font-weight: 600; }
  .cat-icon { --c: var(--accent); flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: color-mix(in srgb, var(--c), #000 var(--icon-shade)); }
  .cat-icon svg { width: 17px; height: 17px; }
  .cat-icon.bad { --c: var(--bad); }
  .tot-name { display: inline-flex; align-items: center; gap: 8px; }
  .tot-name .cat-icon { width: 24px; height: 24px; border-radius: 6px; }
  .tot-name .cat-icon svg { width: 14px; height: 14px; }
  .cat-block { margin-top: 18px; }
  .cat-block:first-of-type { margin-top: 6px; }
  .cat-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--text-faint) 12%, transparent); }
  .cat-name { font-weight: 700; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .cat-count { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); background: var(--bg); border-radius: 20px; padding: 1px 7px; }
  .cat-total { font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-block.bad .cat-head { background: color-mix(in srgb, var(--bad) 16%, transparent); }
  .cat-block.bad .cat-name, .cat-block.bad .cat-total { color: var(--bad); }
  .cat-block.warn .cat-head { background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .cat-block.warn .cat-name, .cat-block.warn .cat-total { color: var(--warn); }
  .cat-block.good .cat-total { color: var(--good); }
  .cat-note { font-size: 0.76rem; color: var(--text-dim); margin: 6px 12px 0; }
  .cat-block .pay-row { padding: 10px 12px; }
  .date-chip { flex: 0 0 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .date-chip b { font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--text); }
  .date-chip span { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-top: 3px; }
  /* Upcoming costs: an issued invoice (or a known amount) vs an estimate. */
  .date-chip.inv { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .date-chip.inv b, .date-chip.inv span { color: var(--accent); }
  .date-chip.est { border-style: dashed; background: transparent; }
  .date-chip.est b { color: var(--text-dim); }
  .pay-row.est .pay-amt { color: var(--text-dim); font-weight: 500; }
  .kind-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .kind-legend { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; font-size: 0.9rem !important; font-weight: 600; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text-dim); font: inherit; cursor: pointer; }
  .kind-legend.on { border-color: var(--text-dim); color: var(--text); background: color-mix(in srgb, var(--text-faint) 14%, transparent); }
  .kind-filter.only-inv .pay-row.est, .kind-filter.only-est .pay-row.inv { display: none; }
  .kind-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
  .kind-legend i.inv { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .kind-legend i.est { border-style: dashed; border-color: var(--text-dim); }
  .date-chip.late { border-color: color-mix(in srgb, var(--bad) 60%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .date-chip.late b, .date-chip.late span { color: var(--bad); }
  ul.tot-parts li { display: block; }
  .tot-row { display: flex; justify-content: space-between; gap: 12px; }
  .tot-bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text-faint) 15%, transparent); margin-top: 5px; overflow: hidden; }
  .tot-bar span { display: block; height: 100%; border-radius: 3px; }
  .tot-box.good .tot-bar span { background: var(--good); }
  .tot-box.bad .tot-bar span { background: var(--bad); }
  .cash-sub { display: flex; gap: 4px; margin: 0 0 16px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
  .cash-sub-btn { flex: 1; appearance: none; border: none; background: none; font: inherit; font-size: 0.95rem; font-weight: 700; color: var(--text-dim); padding: 10px 12px; border-radius: 9px; cursor: pointer; }
  .cash-sub-btn:hover { color: var(--text); }
  .cash-sub-btn.active { background: var(--accent-dim); color: var(--accent); }
  .cash-sub-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pay-group.good .pay-head { color: var(--good); }
  .pay-group { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  .pay-group:first-of-type { border-top: none; padding-top: 4px; }
  .pay-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
  .pay-group.bad .pay-head { color: var(--bad); }
  .pay-group.warn .pay-head { color: var(--warn); }
  .pay-total { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pay-sub { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 700; margin: 10px 0 4px; }
  ul.pay-list { list-style: none; margin: 0; padding: 0; }
  .pay-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .pay-row:last-child { border-bottom: none; }
  .pay-main { flex: 1; min-width: 0; }
  .pay-name { font-size: 0.92rem; color: var(--text); overflow-wrap: anywhere; }
  .pay-meta { font-size: 0.76rem; color: var(--text-dim); margin-top: 2px; }
  .payer { margin-left: 8px; font-size: 0.7rem; font-weight: 400; color: var(--text-dim); white-space: nowrap; vertical-align: 1px; }
  .payer::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: currentColor; opacity: 0.6; }
  .payer-bc::before { background: #d97706; opacity: 0.7; }
  .payer-s::before { background: #3b82f6; opacity: 0.7; }
  .pay-amt { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }
  .pay-tag { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 20px; margin-left: 6px; background: color-mix(in srgb, var(--text-faint) 18%, transparent); color: var(--text-dim); font-weight: 700; white-space: nowrap; }
  .cash-due-date { width: 92px; flex: 0 0 auto; }
  #root-cash .item-hours { flex: 0 0 auto; white-space: nowrap; }
  #root-cash .item-title { min-width: 0; overflow-wrap: anywhere; }
  .tax-risk { margin-bottom: 12px; padding: 10px 14px; border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
  .tax-risk-head { display: flex; justify-content: space-between; gap: 10px; font-size: 0.82rem; font-weight: 600; color: var(--bad); margin-bottom: 4px; }
  .tax-risk ul { list-style: none; margin: 0; padding: 0; }
  .tax-risk li { display: grid; grid-template-columns: 1fr auto 4.2em; gap: 10px; font-size: 0.8rem; padding: 2px 0; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tax-risk li span:nth-child(2), .tax-risk li span:nth-child(3) { text-align: right; }
  .tax-risk li .old { color: var(--bad); }
  .tax-risk-foot { font-size: 0.72rem; color: var(--text-faint); margin-top: 4px; }
  .payroll-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .payroll-table th { text-align: right; font-weight: 500; color: var(--text-dim); font-size: 0.78rem; padding: 4px 0 6px 10px; }
  .payroll-table td { padding: 5px 0 5px 10px; border-top: 1px solid var(--border); vertical-align: top; }
  .payroll-table td:first-child { padding-left: 0; }
  .tabs { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .tab-btn { flex: 0 0 auto; }
  @media (max-width: 640px) {
    .cash-due { flex-wrap: wrap; row-gap: 2px; }
    .cash-due .cash-due-date { width: 100%; }
    .cash-due .item-title { flex: 1 1 0; }
    #root-cash .card { padding: 14px 14px; }
    #root-cash .stat-value { font-size: 1.15rem; }
    #root-cash .cash-calc summary { font-size: 0.86rem; }
  }
  .cash-calc { border-top: 1px solid var(--border); padding: 8px 0; }
  .cash-calc summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; font-size: 0.9rem; }
  .cash-calc summary::-webkit-details-marker { display: none; }
  .cash-calc summary::before { content: '▸'; color: var(--text-faint); font-size: 0.75rem; transition: transform .15s; }
  .cash-calc[open] summary::before { transform: rotate(90deg); }
  .cash-calc summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-grid.cash-five { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat-grid.cash-five .stat-card { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 11px 14px; }
  .stat-grid.cash-five .stat-label { margin: 0; }
  .stat-grid.cash-five .stat-label::after { content: ' ›'; color: var(--accent); }
  .stat-grid.cash-five .stat-value { font-size: 1.3rem; line-height: 1.2; white-space: nowrap; }
  .stat-grid.cash-five .item-sub, .stat-grid.cash-five .stat-sub2 { font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-grid.cash-five .cash-calc-link { display: none; }
  @media (max-width: 900px) { .stat-grid.cash-five { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat-grid.cash-five .stat-value { font-size: 1.12rem; } }
  @media (max-width: 640px) { .stat-grid, .stat-grid.cash-five { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-card[title] { cursor: help; }
  .stat-card[title] .stat-label { text-decoration: underline dotted var(--text-faint); text-underline-offset: 3px; }
  .stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stat-value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.good { color: var(--good); }
  .stat-value.bad { color: var(--bad); }
  .stat-sub { font-size: 0.72rem; color: var(--text-faint); margin-top: 2px; font-variant-numeric: tabular-nums; }

  table.trend { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.trend th, table.trend td { text-align: right; padding: 8px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.trend th:first-child, table.trend td:first-child { text-align: left; }
  table.trend th { color: var(--text-faint); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  table.trend td { border-bottom: 1px solid var(--border); }
  table.trend tr:last-child td { border-bottom: none; }
  table.trend .roas-good { color: var(--good); }
  table.trend .roas-bad { color: var(--bad); }
  table.trend .totals-row td { font-weight: 700; border-bottom: none; }
  .table-scroll { overflow-x: auto; }
  /* Funnel has 4 numeric columns (vs Winners' 1) -- the product title was
     the actual width hog forcing horizontal scroll, not the numbers, so
     cap and ellipsize it instead of letting it demand its full nowrap
     width; tighten padding a bit too. */
  .trend--funnel th, .trend--funnel td { padding: 8px 6px; }
  .trend--funnel .prod-cell span { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sortable-th { cursor: pointer; user-select: none; }
  .sortable-th:hover { color: var(--text); }
  .trend--funnel .funnel-problem-row td { background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .funnel-problem-flag { flex: 0 0 auto; color: var(--bad); font-size: 0.9rem; }

  .prod-thumb { width: 40px; height: 56px; border-radius: 6px; object-fit: cover; object-position: top; background: var(--bg-elevated); flex: 0 0 auto; }
  .prod-thumb-empty { display: inline-block; border: 1px dashed var(--border); }
  .prod-cell { display: flex; align-items: center; gap: 10px; }
  .unit-bar { display: inline-block; width: 80px; height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .unit-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .unit-bar-val { font-variant-numeric: tabular-nums; }
  .zero-list { display: flex; flex-direction: column; }
  .zero-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border);
    font-size: 0.86rem; cursor: pointer;
  }
  .zero-row:last-child { border-bottom: none; }
  .zero-row input[type="checkbox"] { flex: 0 0 auto; width: 16px; height: 16px; accent-color: var(--accent); }
  @media (max-width: 860px) {
    table.trend td:first-child { justify-content: flex-start; }
    table.trend .prod-cell { justify-content: flex-start; text-align: left; }
    table.trend .unit-bar { display: none; }
  }

  @media (max-width: 860px) {
    table.trend thead { display: none; }
    table.trend, table.trend tbody, table.trend tr, table.trend td { display: block; width: 100%; }
    table.trend tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
    table.trend tr:last-child { border-bottom: none; }
    table.trend td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 3px 0; border-bottom: none; white-space: normal; text-align: right; }
    table.trend td::before { content: attr(data-label); color: var(--text-faint); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; text-align: left; }
    table.trend td:first-child { font-weight: 700; font-size: 0.88rem; padding-bottom: 6px; }
    table.trend td:first-child::before { content: ''; }
  }

  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); font-weight: 700; margin: 28px 0 12px;
  }
  .section-title:first-child { margin-top: 0; }
  /* Compact layout: less scrolling on the phone. */
  .cat-block .pay-row { padding: 7px 4px; gap: 10px; }
  .date-chip { flex-basis: 38px; height: 38px; border-radius: 9px; }
  .date-chip b { font-size: 0.95rem; }
  .date-chip span { margin-top: 2px; font-size: 0.58rem; }
  .cat-icon { width: 26px; height: 26px; border-radius: 7px; }
  .cat-icon svg { width: 15px; height: 15px; }
  .pay-name { font-size: 0.88rem; line-height: 1.3; }
  .pay-meta { font-size: 0.72rem; margin-top: 1px; }
  .pay-amt { font-size: 0.95rem; }
  .cat-block { margin-top: 10px; }
  .cat-head { padding: 7px 10px; }
  .cat-head .cat-icon { width: 22px; height: 22px; border-radius: 6px; }
  .cat-head .cat-icon svg { width: 13px; height: 13px; }
  details.cat-block > summary, details.recv-card > summary { list-style: none; cursor: pointer; }
  details.recv-card > summary::-webkit-details-marker { display: none; }
  details.recv-card > summary h2 { margin: 0; }
  details.recv-card > summary h2::after { content: ' ▸'; color: var(--text-faint); }
  details.recv-card[open] > summary h2 { margin-bottom: 10px; }
  details.recv-card[open] > summary h2::after { content: ' ▾'; }
  details.cat-block > summary::-webkit-details-marker { display: none; }
  details.cat-block > summary .cat-total::after { content: '▸'; display: inline-block; margin-left: 8px; color: var(--text-faint); font-size: 0.75rem; transition: transform .15s; }
  details.cat-block[open] > summary .cat-total::after { transform: rotate(90deg); }
  details.cat-block > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tot-box { padding: 14px 16px; }
  .tot-value { font-size: 1.6rem; margin: 2px 0 8px; }
  ul.tot-parts { display: grid; grid-template-columns: 1fr; }
  ul.tot-parts li { padding: 5px 0; font-size: 0.84rem; }
  .tot-row { align-items: center; }
  .tot-row { gap: 6px; }
  .tot-name { gap: 6px; min-width: 0; flex: 1; line-height: 1.25; }
  .tot-txt { min-width: 0; }
  @media (min-width: 720px) { ul.tot-parts { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; } }
  .tot-name .cat-icon { width: 20px; height: 20px; border-radius: 5px; }
  .tot-name .cat-icon svg { width: 12px; height: 12px; }
  .tot-bar { height: 4px; margin-top: 4px; }
  /* Emoji icons: neutral chip, the emoji carries the colour. */
  .cat-icon { background: color-mix(in srgb, var(--text-faint) 14%, transparent); color: inherit; font-size: 15px; line-height: 1; }
  .cat-icon.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); }
  .cat-head .cat-icon { font-size: 13px; }
  .tot-name .cat-icon { font-size: 12px; }
  .tot-late { margin-left: 8px; font-size: 0.72rem; font-weight: 600; color: var(--bad); white-space: nowrap; padding: 1px 6px; border-radius: 20px; background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .ue-lines { list-style: none; margin: 0; padding: 0; }
  .ue-line { display: grid; grid-template-columns: 1fr auto 64px; gap: 10px; padding: 6px 0; font-size: 0.86rem; color: var(--text-dim); border-bottom: 1px dashed var(--border); }
  .ue-line.strong { color: var(--text); font-weight: 700; }
  .ue-num, .ue-per { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .ue-per { color: var(--text-faint); font-size: 0.76rem; }
  table.ue-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  table.ue-table th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.ue-table td { padding: 7px 8px; border-bottom: 1px dashed var(--border); white-space: nowrap; vertical-align: top; }
  .ue-pos { color: var(--good); font-weight: 700; } .ue-neg { color: var(--bad); font-weight: 700; }
  .ue-chip { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .ue-chip.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .ue-chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .ue-chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  #root-unit .tot-box { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <h1 class="brand"><span class="brand-logo" role="img" aria-label="MY"></span><span class="visually-hidden">MY Dashboard</span></h1>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" onclick="refreshDashboard()" title="Reincarca datele">&#8635;</button>
        <button class="icon-btn settings-btn tab-btn" data-tab="settings" title="Setari">&#9881;</button>
      </div>
    </div>
    <div class="meta-pills" id="meta"><span class="meta-pill">se incarca...</span></div>
  </header>
  <div class="tabs">
    <button class="tab-btn" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="production">Production</button>
    <button class="tab-btn" data-tab="profit">Marketing</button>
    <button class="tab-btn" data-tab="pnl">P&amp;L</button>
    <button class="tab-btn active" data-tab="cash">Cashflow</button>
    <button class="tab-btn" data-tab="unit">Unit economics</button>
    <button class="tab-btn" data-tab="trends">Trends</button>
    <button class="tab-btn" data-tab="reco">Actions</button>
  </div>
  <div class="tab-panel" id="panel-overview">
    <div id="root-overview">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-production">
    <div id="root-production">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-profit">
    <div id="root-profit">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-pnl">
    <div id="root-pnl">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel active" id="panel-cash">
    <div id="root-cash">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-unit">
    <div id="root-unit">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-trends">
    <div id="root-trends">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-reco">
    <div id="root-reco">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
  <div class="tab-panel" id="panel-settings">
    <div id="root-settings">
      <div class="loading">Se incarca datele...</div>
    </div>
  </div>
</div>
<script>
async function load() {
  const rootProduction = document.getElementById('root-production');
  const rootProfit = document.getElementById('root-profit');
  const rootPnl = document.getElementById('root-pnl');
  const rootReco = document.getElementById('root-reco');
  const rootSettings = document.getElementById('root-settings');
  const meta = document.getElementById('meta');
  const metaParts = [];
  let productionData = null, profitData = null, pnlData = null;

  try {
    const res = await fetch('dashboard-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    productionData = await res.json();
    renderProduction(productionData, rootProduction);
    metaParts.push({ label: 'Asana', iso: productionData.generatedAt });
    metaParts.push({ label: 'W&amp;B', iso: productionData.generatedAt });
  } catch (e) {
    rootProduction.innerHTML = '<div class="error">Nu am putut incarca datele de productie (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('profit-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    profitData = await res.json();
    renderProfit(profitData, rootProfit);
    metaParts.push({ label: 'Meta', iso: profitData.generatedAt });
    metaParts.push({ label: 'Shopify', iso: profitData.generatedAt });
  } catch (e) {
    rootProfit.innerHTML = '<div class="error">Nu am putut incarca datele de profit (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('b2b-projects-data.json', { cache: 'no-store' });
    if (res.ok) {
      b2bSeedCache = await res.json();
      syncIncomingProjectsWithSeed();
    }
  } catch (e) {}

  try {
    const res = await fetch('pnl-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    pnlData = await res.json();
    renderPnl(pnlData, rootPnl);
    // pnl-data.json e curatat manual (nu la 15 min ca restul) -- nu are
    // generatedAt propriu, Last-Modified de la server e singurul semnal de
    // "cand a fost pusa ultima oara la zi". Prag de prospetime mult mai
    // lung (45 zile) fata de celelalte pill-uri (1h), ca sa nu arate mereu
    // rosu pt ceva actualizat lunar/trimestrial, nu live.
    const pnlLastModified = res.headers.get('Last-Modified');
    if (pnlLastModified) metaParts.push({ label: 'P&L', iso: new Date(pnlLastModified).toISOString(), freshMs: 45 * 24 * 60 * 60 * 1000 });
  } catch (e) {
    rootPnl.innerHTML = '<div class="error">Nu am putut incarca datele P&amp;L (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('cash-data.enc.json', { cache: 'no-store' });
    if (res.ok) {
      cashEncCache = await res.json();
      metaParts.push({ label: 'Cashflow', iso: cashEncCache.generatedAt, freshMs: 2 * 60 * 60 * 1000 });
      // Inputs of the cash report, each refreshed on its own schedule:
      // ANAF e-Factura every 3 hours, SmartBill once a day.
      const src = cashEncCache.sources || {};
      if (src.anaf) metaParts.push({ label: 'ANAF', iso: src.anaf, freshMs: 6 * 60 * 60 * 1000 });
      if (src.smartbill) metaParts.push({ label: 'SmartBill', iso: src.smartbill, freshMs: 4 * 60 * 60 * 1000 });
    }
    await renderCash();
  } catch (e) {
    document.getElementById('root-cash').innerHTML = '<div class="error">Nu am putut incarca datele de cash (' + e.message + ').</div>';
  }

  try {
    renderReco(productionData, profitData, pnlData, rootReco);
  } catch (e) {
    rootReco.innerHTML = '<div class="error">Nu am putut calcula recomandarile (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('settings-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    renderSettings(data, rootSettings);
  } catch (e) {
    rootSettings.innerHTML = '<div class="error">Nu am putut incarca datele de setari (' + e.message + ').</div>';
  }

  try {
    const res = await fetch('trends-data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    renderTrends(data, document.getElementById('root-trends'));
    metaParts.push({ label: 'Trends', iso: data.generatedAt });
  } catch (e) {
    document.getElementById('root-trends').innerHTML = '<div class="error">Nu am putut incarca datele de trends (' + e.message + ').</div>';
  }

  try {
    renderOverview(productionData, profitData, pnlData, document.getElementById('root-overview'));
  } catch (e) {
    document.getElementById('root-overview').innerHTML = '<div class="error">Nu am putut calcula overview (' + e.message + ').</div>';
  }

  meta.innerHTML = metaParts.map((p) => {
    const ageMs = Date.now() - new Date(p.iso).getTime();
    const dotColor = ageMs < (p.freshMs || 60 * 60 * 1000) ? 'var(--good)' : 'var(--bad)';
    return '<span class="meta-pill"><span class="meta-dot" style="background:' + dotColor + '"></span>' + p.label + ' ' + fmtDateTime(p.iso) + '</span>';
  }).join('');
}

function initTabs() {
  const buttons = document.querySelectorAll('.tab-btn');
  const activateTab = (name, updateHash) => {
    const btn = [...buttons].find((b) => b.dataset.tab === name);
    if (!btn) return false;
    buttons.forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
    if (updateHash) history.replaceState(null, '', '#' + name);
    return true;
  };
  buttons.forEach((btn) => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab, true));
  });
  window.addEventListener('hashchange', () => activateTab(location.hash.slice(1), false));
  const initial = location.hash.slice(1);
  if (!initial || !activateTab(initial, false)) activateTab('cash', false);
}

function refreshDashboard() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;
  load().finally(() => {
    btn.classList.remove('spinning');
    btn.disabled = false;
  });
}

function pushToAsana() {
  const ok = window.confirm('Sigur vrei sa publici planul de azi pe Asana? Se vor crea task-uri reale pentru Carl, Felicia si Flori.');
  if (!ok) return;
  window.open(

}
function barClass(hours, capacity) {
  const ratio = hours / capacity;
  if (ratio > 1.02) return 'over';
  if (ratio > 0.92) return 'warn';

// Fostul tag "ramas" (ceas) e de fapt un task deja creat pe Asana, nu doar

const ICON_SCISSORS = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8.5 19 19M8.5 15.5 19 5"/></svg>';

// 'asana' e acum singura sursa a iconitei -- marcheaza ORICE item care e
// deja un task real pe Asana (nu doar cele restante/'leftover', care erau
// mereu un subset al asteia). 'leftover' ramane doar semantic (folosit la
// sortare/prioritate in backend), fara vizual propriu, ca sa nu duca la
// doua iconite pe acelasi rand cand ambele tag-uri apar impreuna.
function badgeHtml(tag) {
  if (tag === 'predicted') return '<span class="badge predicted">PR</span>';
  if (tag === 'asana') return '<span class="badge leftover" title="deja pe Asana">' + ICON_ASANA + '</span>';
  if (tag === 'buffer') return '<span class="badge buffer" title="deja taiat, din buffer">' + ICON_SCISSORS + '</span>';
  if (tag === 'wb') return '<span class="badge wb">WB</span>';
  if (tag === 'shopify') return '<span class="badge shopify">SH</span>';

function badgesFor(tags) {
  return (tags || []).filter((t) => t !== 'asana').map(badgeHtml).join('');
}
// The "already on Asana" marker reads better as a prefix right before the
// task, not buried after the name alongside the other status badges.
function asanaPrefixBadge(tags) {
  if (!(tags || []).includes('asana')) return '';
  return badgeHtml('asana').replace('class="badge leftover"', 'class="badge leftover badge-prefix"');

// --- Plan editabil (drag & drop) ------------------------------------
// Preview local, nu persista singur: dashboard-data.json e regenerat din
// automat la 15 min si suprascrie orice reordonare facuta aici. "Copiaza
// ordinea" exporta un JSON de trimis ca sa devina un override permanent
// (aplicat si la task-urile reale create noaptea).
let planState = null;
let planDataCache = null;
let dragId = null;

function itemDisplayText(it) {
  return (it.title || it.name || '').replace(/^\d+\.\s*/, '');
}

function buildPlanState(data) {
  const mk = (list, section) => (list || []).map((it, i) => ({
    _id: section + '-' + i,
    text: itemDisplayText(it),
    hours: typeof it.hours === 'number' ? it.hours : null,
    tags: it.tags || [],
    orderName: it.orderName || null,
    orderLinks: it.orderLinks || null,
  }));
  return {
    felicia: mk(data.felicia.items, 'felicia'),
    flori: mk(data.flori.items, 'flori'),
    carl: mk(data.croit, 'carl'),
  };
}

function planSectionHours(section) {
  return planState[section].reduce((s, it) => s + (it.hours || 0), 0);
}

function findPlanItem(id) {
  for (const section of ['felicia', 'flori', 'carl']) {
    const idx = planState[section].findIndex((it) => it._id === id);
    if (idx !== -1) return { section, idx };
  }
  return null;
}

// FLIP (First-Last-Invert-Play): retine pozitia curenta a fiecarui rand
// inainte de re-randare, apoi dupa re-randare le "trage" vizual din
// pozitia veche in cea noua -- randurile aluneca/se suprapun in tranzitie
// in loc sa sara instant la noua ordine.
function captureRects(root) {
  const rects = {};
  root.querySelectorAll('[data-id]').forEach((el) => { rects[el.dataset.id] = el.getBoundingClientRect(); });
  return rects;
}

function playFlipAnimation(root, prevRects, movedId) {
  root.querySelectorAll('[data-id]').forEach((el) => {
    const id = el.dataset.id;
    const prev = prevRects[id];
    if (prev) {
      const next = el.getBoundingClientRect();
      const dx = prev.left - next.left;
      const dy = prev.top - next.top;
      if (dx || dy) {
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px,${dy}px)`;
        el.getBoundingClientRect(); // forteaza reflow inainte de a porni tranzitia
        requestAnimationFrame(() => {
          el.style.transition = 'transform .28s ease';
          el.style.transform = '';
        });
      }
    }
    if (id === movedId) {
      el.classList.add('item-flash');
      setTimeout(() => el.classList.remove('item-flash'), 600);
    }
  });
}

let hoverEl = null;
let hoverPos = null;

function clearHoverIndicator() {
  if (hoverEl) hoverEl.classList.remove('drop-before', 'drop-after');
  hoverEl = null;
  hoverPos = null;
}

function attachDragHandlers(root) {
  root.addEventListener('dragstart', (e) => {
    const el = e.target.closest('[data-id]');
    if (!el) return;
    dragId = el.dataset.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
  });
  root.addEventListener('dragend', (e) => {
    const el = e.target.closest('[data-id]');
    if (el) el.classList.remove('dragging');
    clearHoverIndicator();
  });
  root.addEventListener('dragover', (e) => {
    const list = e.target.closest('[data-section]');
    if (!list) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    // Randul peste care planeaza cursorul se "deschide" sus sau jos, dupa
    // in ce jumatate a randului e cursorul -- arata live directia in care
    // se va muta item-ul, inainte sa dai drop.
    const rowEl = e.target.closest('[data-id]');
    if (rowEl && rowEl.dataset.id !== dragId) {
      const rect = rowEl.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height / 2 ? 'before' : 'after';
      if (hoverEl !== rowEl || hoverPos !== pos) {
        clearHoverIndicator();
        rowEl.classList.add('drop-' + pos);
        hoverEl = rowEl;
        hoverPos = pos;
      }
    } else if (hoverEl) {
      clearHoverIndicator();
    }
  });
  root.addEventListener('drop', (e) => {
    const list = e.target.closest('[data-section]');
    if (!list) return;
    e.preventDefault();
    const id = dragId || e.dataTransfer.getData('text/plain');
    if (!id) return;
    const found = findPlanItem(id);
    if (!found) return;
    const prevRects = captureRects(root);
    const targetSection = list.dataset.section;
    const overEl = hoverEl;
    const overPos = hoverPos;
    const computeInsertAt = () => {
      let at = planState[targetSection].length;
      if (overEl && overEl.dataset.id !== id) {
        const idx = planState[targetSection].findIndex((it) => it._id === overEl.dataset.id);
        at = idx === -1 ? planState[targetSection].length : (overPos === 'after' ? idx + 1 : idx);
      }
      return at;
    };
    // Carl inca nu a taiat bucata -- o tragere de la el la o fata e doar o
    // avanpremiera a ce urmeaza (acelasi principiu ca umplerea automata la
    // 7h din backend), nu o reasignare -- ramane si in coada lui pana o
    // taie el efectiv. Intre fete, sau in interiorul aceleiasi liste
    // (reordonare), ramane o mutare normala.
    if (found.section === 'carl' && targetSection !== 'carl') {
      const original = planState.carl[found.idx];
      const insertAt = computeInsertAt();
      const copy = { ...original, _id: targetSection + '-copy-' + Date.now() + '-' + Math.random().toString(36).slice(2) };
      planState[targetSection].splice(insertAt, 0, copy);
    } else {
      const [item] = planState[found.section].splice(found.idx, 1);
      const insertAt = computeInsertAt();
      planState[targetSection].splice(insertAt, 0, item);
    }
    dragId = null;
    clearHoverIndicator();
    renderPlanBoard(root);
    playFlipAnimation(root, prevRects, id);
  });
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

async function decryptCash(enc, pass) {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(enc.salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(enc.iv) }, key, b(enc.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

  if (!pass) {
    document.getElementById('root-unit').innerHTML = '<div class="card"><div class="item-sub">Deschide întâi tab-ul Cashflow cu parola; datele sunt aceleași.</div></div>';
    return renderCashLogin(root);
  }
  try {
    cashDataCache = await decryptCash(cashEncCache, pass);
  } catch (e) {
    lsDel(CASH_PASS_KEY);
    return renderCashLogin(root, 'Parola nu e corectă.');
  }
  renderCashData(root, cashDataCache);
  renderUnit(cashDataCache);
}

/** Unit economics: what is left from each leu sold online over the last 30
 * days, the fixed costs it has to cover, the break-even sales and, per
 * country, the sales-to-ads ratio (MER) needed to break even. Online shop
 * only; B2B invoices come on top. All inputs are the cash report's real
 * data; the few assumptions are named on the page. */
function renderUnit(d) {
  const root = document.getElementById('root-unit');
  if (!d || !d.sales30) { root.innerHTML = '<div class="card"><div class="item-sub">Datele apar la următoarea actualizare a raportului de cash.</div></div>'; return; }
  const sumv = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);
  const S = d.sales30.total;
  const ui = d.unitInputs || {};
  const shipIntl = ui.intlShipPerOrder || 110;
  // Money that really reaches the bank per leu sold: last month's bank
  // inflow per channel vs the orders of the last 30 days (fees, couriers,
  // refused COD parcels and refunds already taken out). PayPal: 96.5%.
  const bm = d.sales30.byMethod || {};
  const bankIn = d.inflowRate ? sumv(d.inflowRate.total) : 0;
  const bankSales = (bm.card || 0) + (bm.cod || 0) + (bm.klarna || 0);
  const realizedRatio = bankSales ? Math.min(1, (bankIn + (bm.paypal || 0) * 0.965) / (bankSales + (bm.paypal || 0))) : 0.95;
  const vatOf = (x) => (x * 0.21) / 1.21;
  const matShare = d.materialsShare || 0.15;
  const rec = d.recurring || [];
  const monthly = (pred) => rec.filter(pred).reduce((t, r) => t + r.amount, 0);
  const returnsMonthly = monthly((r) => /retur/i.test(r.name));
  const fixedParts = [
    ['Salarii', monthly((r) => r.category === 'Salarii')],
    ['Taxe pe salarii (BS + CAM)', ui.salaryTaxesMonthly || 0],
    ['Chirie & utilități', monthly((r) => r.category === 'Chirie & utilități')],
    ['Abonamente', monthly((r) => r.category === 'Abonamente' || (r.category === 'Cheltuieli variabile' && !/retur/i.test(r.name)))],
    ['Contabilitate', monthly((r) => r.category === 'Contabilitate')],
    ['Echipament', monthly((r) => r.category === 'Echipament')],
  ];
  const F = fixedParts.reduce((t, p) => t + p[1], 0);
  const metaBy = d.metaSpend30ByCountry || {};
  const ads = sumv(metaBy);
  const countries = Object.entries(d.sales30.byCountry || {}).map(([c, x]) => {
    const realized = x.revenue * realizedRatio;
    const vat = vatOf(realized), mat = realized * matShare;
    const ship = c === 'RO' ? 0 : x.orders * shipIntl;
    const ret = S ? (returnsMonthly * x.revenue) / S : 0;
    const cm1 = realized - vat - mat - ship - ret;
    const spend = metaBy[c] || 0;
    return { c, revenue: x.revenue, orders: x.orders, cm1, spend, contrib: cm1 - spend, merNow: spend ? x.revenue / spend : null, merNeed: cm1 > 0 ? x.revenue / cm1 : null };
  });
  for (const [c, spend] of Object.entries(metaBy)) if (!countries.some((x) => x.c === c)) countries.push({ c, revenue: 0, orders: 0, cm1: 0, spend, contrib: -spend, merNow: 0, merNeed: null });
  countries.sort((a, b) => b.revenue - a.revenue || b.spend - a.spend);
  const realized = S * realizedRatio;
  const lines = [
    ['Vânzări (cu TVA)', S],
    ['Pierdut la încasare: comisioane, curieri, refuzuri, rambursări', -(S - realized)],
    ['TVA', -vatOf(realized)],
    ['Materiale (' + Math.round(matShare * 100) + '%)', -realized * matShare],
    ['Transport internațional (' + shipIntl + ' lei/colet)', -countries.reduce((t, x) => t + (x.c === 'RO' ? 0 : x.orders * shipIntl), 0)],
    ['Retururi', -returnsMonthly],
  ];
  const cm1 = lines.reduce((t, l) => t + l[1], 0);
  const cm2 = cm1 - ads;
  const result = cm2 - F;
  const cm1Pct = S ? cm1 / S : 0, cm2Pct = S ? cm2 / S : 0;
  const breakEven = cm2Pct > 0 ? F / cm2Pct : null;
  const pct = (x) => Math.round(x * 100) + '%';
  const per100 = (x) => (S ? Math.round((x / S) * 100) : 0);
  const lineRow = (label, v, strong) => '<li class="ue-line' + (strong ? ' strong' : '') + '"><span>' + label + '</span><span class="ue-num">' + (v < 0 ? '−' : '') + fmtLei(Math.abs(v)) + '</span><span class="ue-per">' + (v < 0 ? '−' : '') + Math.abs(per100(v)) + ' / 100</span></li>';
  const verdict = (x) => !x.revenue ? ['fără vânzări', 'bad'] : x.merNeed == null ? ['pierde la fiecare vânzare', 'bad'] : !x.spend ? ['fără reclame', 'ok'] : x.merNow >= x.merNeed * 1.5 ? ['profitabil', 'ok'] : x.merNow >= x.merNeed ? ['la limită', 'warn'] : ['pierde bani', 'bad'];
  const countryRows = countries.filter((x) => x.revenue > 300 || x.spend > 0).map((x) => {
    const [v, tone] = verdict(x);
    return '<tr><td>' + x.c + '</td><td>' + fmtLei(x.revenue) + '<div class="item-sub">' + x.orders + ' com.</div></td><td>' + (x.spend ? fmtLei(x.spend) : '–') + '</td><td>' + (x.merNow ? x.merNow.toLocaleString('ro-RO', { maximumFractionDigits: 1 }) : '–') + '</td><td>' + (x.merNeed ? x.merNeed.toLocaleString('ro-RO', { maximumFractionDigits: 1 }) : '–') + '</td><td class="' + (x.contrib >= 0 ? 'ue-pos' : 'ue-neg') + '">' + (x.contrib < 0 ? '−' : '+') + fmtLei(Math.abs(x.contrib)) + '</td><td><span class="ue-chip ' + tone + '">' + v + '</span></td></tr>';
  }).join('');
  root.innerHTML =
    '<div class="tot-box ' + (result >= 0 ? 'good' : 'bad') + '"><div class="tot-label">Rezultat lunar al magazinului online · ultimele 30 de zile</div><div class="tot-value">' + (result >= 0 ? '+' : '−') + fmtLei(Math.abs(result)) + '</div>' +
      '<div class="item-sub">' + (result < 0 ? 'Îți lipsesc ~' + fmtLei(-result) + ' pe lună ca să fii pe 0. Facturile B2B (Merlins etc.) vin pe deasupra și acoperă o parte.' : 'Online-ul acoperă costurile fixe; B2B vine pe deasupra.') + '</div></div>' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-label">Marjă înainte de reclame</div><div class="stat-value">' + pct(cm1Pct) + '</div><div class="item-sub">' + Math.round(cm1Pct * 100) + ' lei din 100 vânduți</div></div>' +
      '<div class="stat-card"><div class="stat-label">Marjă după reclame</div><div class="stat-value" style="color:' + (cm2Pct > 0 ? 'var(--good)' : 'var(--bad)') + '">' + pct(cm2Pct) + '</div><div class="item-sub">reclame: ' + fmtLei(ads) + ' (' + pct(S ? ads / S : 0) + ')</div></div>' +
      '<div class="stat-card"><div class="stat-label">Costuri fixe / lună</div><div class="stat-value">' + fmtLei(F) + '</div><div class="item-sub">salarii, chirie, abonamente…</div></div>' +
      '<div class="stat-card"><div class="stat-label">Prag de rentabilitate</div><div class="stat-value">' + (breakEven ? fmtLei(breakEven) : '—') + '</div><div class="item-sub">vânzări online / lună · acum ' + fmtLei(S) + '</div></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:16px"><h2>Din fiecare 100 lei vânduți online</h2><ul class="ue-lines">' +
      lines.map((l, i) => lineRow(l[0], l[1], i === 0)).join('') + lineRow('= Marjă înainte de reclame', cm1, true) + lineRow('Reclame Meta', -ads) + lineRow('= Marjă de contribuție', cm2, true) +
      lineRow('Costuri fixe', -F) + lineRow('= Rezultat', result, true) + '</ul>' +
      '<div class="item-sub" style="margin-top:8px">Încasat efectiv: ' + pct(realizedRatio) + ' din vânzări (banca în ' + (d.inflowRate ? d.inflowRate.month : '—') + ' față de comenzi). Doar magazinul online; fără impozitul pe profit/micro.</div></div>' +
    '<div class="card" style="margin-bottom:16px"><h2>Pe țări · reclame vs vânzări reale</h2><div style="overflow-x:auto"><table class="ue-table"><thead><tr><th>Țară</th><th>Vânzări</th><th>Reclame</th><th>MER acum</th><th>MER de prag</th><th>Contribuție</th><th></th></tr></thead><tbody>' + countryRows + '</tbody></table></div>' +
      '<div class="item-sub" style="margin-top:8px"><b>MER</b> = vânzări ÷ reclame. <b>MER de prag</b> = cât trebuie să vinzi pentru 1 leu în reclame ca să nu pierzi (după TVA, materiale, încasare și, în afara României, transportul de ' + shipIntl + ' lei/colet). Sub prag, campania pierde bani la fiecare vânzare.</div></div>' +
    '<div class="card" style="margin-bottom:16px"><h2>Cum ajungi pe 0</h2><ul class="items">' +
      (result < 0 ? [
        'Mai multe vânzări la aceeași eficiență: <b>+' + fmtLei(cm2Pct > 0 ? -result / cm2Pct : 0) + '</b> vânzări online pe lună' + (cm2Pct > 0 ? '' : ' (nu ajută cât marja după reclame e ≤ 0)'),
        'Sau tai costuri fixe cu <b>' + fmtLei(-result) + '</b> pe lună',
        'Sau crești marja cu <b>' + (S ? (Math.round((-result / S) * 1000) / 10).toLocaleString('ro-RO') : 0) + ' puncte procentuale</b> (prețuri, mai puține refuzuri, transport mai ieftin, reclame mai eficiente)',
      ] : ['Ești peste prag: fiecare 100 lei în plus vânduți aduc ~' + Math.round(cm2Pct * 100) + ' lei.']).map((t) => '<li class="item"><span class="item-title">' + t + '</span></li>').join('') + '</ul></div>' +
    '<div class="card"><h2>Costuri fixe pe lună</h2><ul class="tot-parts">' + fixedParts.filter((p) => p[1] > 0).sort((a, b) => b[1] - a[1]).map((p) => '<li><div class="tot-row"><span class="tot-name">' + catIcon(p[0].startsWith('Taxe') ? 'Taxe' : p[0]) + '<span class="tot-txt">' + p[0] + '</span></span><span>' + fmtLei(p[1]) + '</span></div></li>').join('') + '</ul></div>';
}

/** Day-by-day projection for the next `days` days, keeping every
 * contribution so the tab can show exactly what each total is made of:
 * known money (open Shopify orders by payout date, recent SmartBill B2B
 * invoices at 30 days), future sales at the last-28-day run rate (landing
 * after each method's payout delay; PayPal included, it sits in the PayPal
 * balance, not in the bank statements), recurring payments on their usual day of month, Meta daily. */
const CASH_NET = { cod: 0.95, card: 0.97, klarna: 0.95, paypal: 0.965 };
// Unshipped COD orders still get cancelled or refused before they ship.
// A COD parcel Sameday already delivered pays in full; otherwise refusals and cancellations.
const netOf = (i) => (i.delivered ? 1 : i.method === 'cod' && !i.shipped ? 0.8 : CASH_NET[i.method] || 1);
const CASH_METHOD = { cod: 'Ramburs (Sameday)', card: 'Card (Shopify Payments)', klarna: 'Klarna', paypal: 'PayPal', payout: 'Payout Shopify anunțat' };
function buildCashProjection(d, start, days) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayKey = dayKey(today);
  const knownByDay = {};
  const addKnown = (key, amount) => { const k = key < todayKey ? todayKey : key; knownByDay[k] = (knownByDay[k] || 0) + amount; };
  for (const i of d.incoming) addKnown(i.expected, i.amount * netOf(i));
  for (const r of d.receivables || []) if (r.counted) addKnown(r.expected, r.amount);
  const rows = [];
  let bal = start;
  for (let k = 0; k < days; k++) {
    const day = new Date(today); day.setDate(today.getDate() + k);
    const key = dayKey(day);
    const forecast = {};
    // Future sales: what actually reached the bank per day last month (net of
    // fees, refusals and cancellations); order value as a fallback.
    const rate = d.inflowRate ? d.inflowRate.perDay : null;
    for (const [m, perDay] of Object.entries(d.dailySalesByMethod)) {
      if (!CASH_NET[m]) continue;
      const lag = (d.lagDays[m] || 3) + (m === 'cod' ? d.codLeadDays : 0);
      if (k - lag >= 1) forecast[m] = rate && rate[m] != null ? rate[m] : perDay * CASH_NET[m];
    }
    const inForecast = Object.values(forecast).reduce((a, b) => a + b, 0);
    const out = [];
    if (k > 0) {
      // A real invoice (d.bills) replaces that month's estimate of the same
      // recurring payment and lands on its own due date.
      const month = key.slice(0, 7);
      const dim = new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate();
      for (const r of d.recurring) {
        if (day.getDate() !== Math.min(r.day, dim)) continue;
        if ((d.bills || []).some((b) => b.replaces === r.name && b.month === month)) continue;
        out.push(r);
      }
      // payOn: the day the user plans to pay (taxes paid late on purpose).
      // A past-due bill the user plans to pay on a later day sits on that day
      // (not under "plătește acum"), marked as late.
      for (const b of d.bills || []) if ((b.payOn || b.due) === key) out.push({ ...b, bill: true, overdue: false, pastDue: b.due < todayKey });
    }
    if (k === 0) for (const b of d.bills || []) if ((b.payOn || b.due) <= key) out.push({ ...b, bill: true, overdue: b.due < key });
    const meta = k > 0 ? d.metaDaily : 0;
    // Materials for future sales: a share of the forecast money (15% = what
    // material purchases were of collected revenue, Jul–Sep 2026).
    const materials = inForecast * (d.materialsShare || 0);
    const outSum = out.reduce((s, r) => s + r.amount, 0) + meta + materials;
    // Regular income (Wolf & Badger) on its usual day of the month.
    // A month-specific amount (incomeOverrides) wins over the usual one.
    const income = (d.recurringIncome || []).filter((r) => day.getDate() === Math.min(r.day, new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate()))
      .map((r) => { const o = (d.incomeOverrides || []).find((x) => x.name === r.name && x.month === key.slice(0, 7)); return o ? { ...r, amount: o.amount, note: o.note } : r; })
      .filter((r) => r.amount > 0);
    const inKnown = (knownByDay[key] || 0) + income.reduce((t, r) => t + r.amount, 0);
    bal += inKnown + inForecast - outSum;
    rows.push({ day, key, inKnown, inForecast, forecast, income, out, meta, materials, outSum, bal });
  }
  return rows;
}

function cashChart(rows, minBalance) {
  const W = 760, H = 200, pl = 8, pr = 8, pt = 14, pb = 22;
  const vals = rows.map((r) => r.bal);
  const lo = Math.min(0, minBalance, ...vals), hi = Math.max(minBalance, ...vals) * 1.05 || 1;
  const x = (i) => pl + (i / (rows.length - 1)) * (W - pl - pr);
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const pts = rows.map((r, i) => x(i).toFixed(1) + ',' + y(r.bal).toFixed(1)).join(' ');
  const area = 'M' + x(0) + ',' + y(lo) + ' L' + pts.replace(/ /g, ' L') + ' L' + x(rows.length - 1) + ',' + y(lo) + ' Z';
  let ticks = '';
  rows.forEach((r, i) => {
    if (i % 7 === 0) ticks += '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" fill="var(--text-faint)" text-anchor="' + (i === 0 ? 'start' : 'middle') + '">' + r.day.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' }) + '</text>';
  });
  const minI = vals.indexOf(Math.min(...vals));
  const low = vals[minI] < minBalance;
  return '<div style="position:relative">' +
    '<svg id="cash-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Sold estimat pe 8 săptămâni" style="display:block;overflow:visible">' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--border)"/>' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(minBalance) + '" y2="' + y(minBalance) + '" stroke="var(--warn)" stroke-dasharray="4 4"/>' +
    '<text x="' + (W - pr) + '" y="' + (y(minBalance) - 4) + '" font-size="10" fill="var(--text-faint)" text-anchor="end">prag minim ' + fmtLei(minBalance) + '</text>' +
    '<path d="' + area + '" fill="var(--accent)" opacity="0.10"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="' + x(minI) + '" cy="' + y(vals[minI]) + '" r="4" fill="' + (low ? 'var(--bad)' : 'var(--accent)') + '" stroke="var(--bg-elevated)" stroke-width="2"/>' +
    '<line id="cash-cross" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--text-faint)" visibility="hidden"/>' +
    ticks + '<rect id="cash-hit" x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/></svg>' +
    '<div id="cash-tip" class="meta-pill" style="position:absolute;top:0;pointer-events:none;display:none;white-space:normal;max-width:220px;line-height:1.4"></div></div>';
}

function bindCashChart(rows) {
  const svg = document.getElementById('cash-svg'), hit = document.getElementById('cash-hit');
  const tip = document.getElementById('cash-tip'), cross = document.getElementById('cash-cross');
  if (!svg) return;
  const move = (ev) => {
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(((ev.clientX - box.left) / box.width) * (rows.length - 1))));
    const r = rows[i], px = 8 + (i / (rows.length - 1)) * 744;
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    tip.style.display = 'block';
    tip.style.left = Math.min(box.width - 220, Math.max(0, (px / 760) * box.width - 110)) + 'px';
    tip.innerHTML = '<strong>' + fmtDay(r.day) + '</strong><br>Sold estimat: ' + fmtLei(r.bal) +
      '<br>Intră: ' + fmtLei(r.inKnown + r.inForecast) + ' · Iese: ' + fmtLei(r.outSum) +
      (r.out.length ? '<br>' + r.out.map((o) => o.name).join(', ') : '');
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); });
}

// "Ajung banii de salarii?": the next salary days, per company, with what is
// in the bank now plus what lands before them. All shop money (card, Klarna,
// Sameday COD) reaches ING (Bad Copy); BT (Simplicated) only gets transfers.
function payrollCard(d, bals) {
  const sum = (xs, f) => xs.reduce((s, x) => s + (f ? f(x) : x.amount), 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const nextOn = (dom) => {
    for (let k = 0; k < 2; k++) {
      const m = new Date(today.getFullYear(), today.getMonth() + k, 1);
      const dim = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      const day = new Date(m.getFullYear(), m.getMonth(), Math.min(dom, dim));
      if (day >= today) return day;
    }
    return null;
  };
  const monthOf = (day) => dayKey(day).slice(0, 7);
  const items = [];
  for (const r of d.recurring || []) {
    if (r.category !== 'Salarii') continue;
    const day = nextOn(r.day);
    if (!day || (d.bills || []).some((b) => b.replaces === r.name && b.month === monthOf(day))) continue;
    items.push({ name: r.name, amount: r.amount, payer: r.payer, day, estimate: r.estimate });
  }
  for (const b of d.bills || []) {
    if (b.category !== 'Salarii' || !(b.amount > 0)) continue;
    const day = new Date(b.due + 'T00:00:00');
    if (day >= today) items.push({ name: b.name, amount: b.amount, payer: b.payer, day, estimate: b.estimate });
  }
  // The month's last working day (Friday when the month ends on a weekend);
  // once it has passed, next month's.
  const lastWorkday = (y, m) => { const x = new Date(y, m + 1, 0); while ([0, 6].includes(x.getDay())) x.setDate(x.getDate() - 1); return x; };
  let end = lastWorkday(today.getFullYear(), today.getMonth());
  if (end < today) end = lastWorkday(today.getFullYear(), today.getMonth() + 1);
  const endKey = dayKey(end);
  const from = new Date(end); from.setDate(end.getDate() - 6);
  const monthEnd = new Date(end.getFullYear(), end.getMonth() + 1, 0);
  const pay = items.filter((i) => i.day >= from && i.day <= monthEnd).sort((a, b) => a.day - b.day);
  const first = pay.length ? pay[0].day : end;
  const co = (p) => (p === 'Simplicated' ? 's' : 'bc');

  // Money in before the last salary day (expected on or before it).
  const inc = (d.incoming || []).filter((i) => i.expected <= endKey);
  const groups = [
    ['Ramburs încasat de Sameday, netransferat', inc.filter((i) => i.method === 'cod' && i.delivered && !i.withheld), true],
    ['Factură Sameday reținută din ramburs', inc.filter((i) => i.withheld), true],
    ['Plăți Shopify cu cardul', inc.filter((i) => i.method === 'card' || i.method === 'payout'), true],
    ['Klarna', inc.filter((i) => i.method === 'klarna'), true],

    pay.map((i) => line(i.name + ' · ' + fmtDay(i.day) + (i.estimate ? ' (estimare)' : ''), co(i.payer) === 'bc' ? -i.amount : null, co(i.payer) === 's' ? -i.amount : null)).join('') +

    '</tbody></table>';

    table + move +

}

// Compact "Risc de poprire ANAF" banner: taxes past due, oldest first.

  const today = dayKey(new Date());
  const late = (d.bills || []).filter((b) => b.category === 'Taxe' && b.amount > 0 && b.due < today).sort((a, b) => a.due.localeCompare(b.due));
  if (!late.length) return '';
  const days = (b) => Math.floor((Date.now() - Date.parse(b.due + 'T00:00:00')) / 86400000);
  const short = (n) => n.split(' (')[0].split(' · ')[0];
  return '<div class="card tax-risk"><div class="tax-risk-head"><span>Risc de poprire ANAF</span><b>' + fmtLei(late.reduce((s, b) => s + b.amount, 0)) + '</b></div>' +
    '<ul>' + late.map((b) => '<li><span>' + short(b.name) + '</span><span>' + fmtLei(b.amount) + '</span><span class="' + (days(b) >= 30 ? 'old' : '') + '">' + days(b) + ' zile</span></li>').join('') + '</ul>' +
    '<div class="tax-risk-foot">După scadență: somație în SPV, apoi poprire la 15 zile.</div></div>';
}

function fmtMoney(n) {
  return n.toLocaleString('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' RON';
}

let profitDataCache = null;
let profitPeriod = 14;

/** Proiectie de venit D2C pt luna calendaristica curenta, bazata pe
 * vanzarile reale Shopify din profit-data.json (nu pe media istorica) --
 * suma zilelor scurse din luna, extrapolata liniar pe restul zilelor. */
function computeCurrentMonthRunRate() {
  if (!profitDataCache || !profitDataCache.days || !profitDataCache.days.length) return null;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthDays = profitDataCache.days.filter((d) => {
    const dt = new Date(d.date + 'T00:00:00');
    return dt.getFullYear() === y && dt.getMonth() === m;
  });
  if (!monthDays.length) return null;
  const actual = monthDays.reduce((s, d) => s + d.revenue, 0);
  const actualProfit = monthDays.reduce((s, d) => s + d.netProfit, 0);
  const daysElapsed = monthDays.length;
  const projected = (actual / daysElapsed) * daysInMonth;
  const projectedProfit = (actualProfit / daysElapsed) * daysInMonth;
  return { actual, actualProfit, daysElapsed, daysInMonth, projected, projectedProfit };
}

/** Rezultatul net COMPLET estimat pt luna curenta (D2C real + B2B
 * incoming - toate costurile: COGS/marketing/salarii/taxe/altele) --
 * exact ce arata cardul "Rezultat net estimat" din P&L. Extras separat ca
 * sa poata fi refolosit si de Overview, fara sa duplice logica (si sa nu
 * ajunga sa arate 2 cifre diferite pt "profit"). baselineT = media pe 8
 * luni fara B2B (computeBaselineAverage(pnlDataCache)). */
function computeCurrentMonthPnlEstimate(baselineT) {
  const incomingB2BTotal = loadIncomingProjects().reduce((s, p) => s + p.amount, 0);
  const runRate = computeCurrentMonthRunRate();
  const d2cEstimate = runRate ? runRate.projected : baselineT.revenue;
  const costsTotal = baselineT.cogs + baselineT.marketing + baselineT.salaries + baselineT.taxes + baselineT.other;
  const netEstimate = d2cEstimate - costsTotal;
  const revenueWithIncoming = d2cEstimate + incomingB2BTotal;
  const netWithIncoming = netEstimate + incomingB2BTotal;
  return { incomingB2BTotal, d2cEstimate, costsTotal, netEstimate, revenueWithIncoming, netWithIncoming };
}

function renderProfit(data, root) {
  profitDataCache = data;
  renderProfitPeriod(root);
}

function setProfitPeriod(days, root) {
  profitPeriod = days;
  renderProfitPeriod(root || document.getElementById('root-profit'));
}
