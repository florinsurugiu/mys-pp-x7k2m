    '</table></div>' +
    '<div class="card table-scroll"><table class="trend">' +
      '<thead><tr><th>Zi</th><th>Venit</th><th>Cost productie</th><th>Transport</th><th>Cheltuit ads</th><th>Profit net</th><th>ROAS</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>' +
    campaignsSection(data.campaigns || [], data.lookbackDays);
}

function campaignsSection(campaigns, lookbackDays) {
  if (!campaigns.length) return '';
  const rows = campaigns.map((c) => {
    const roasCls = c.metaRoas == null ? '' : c.metaRoas >= 4 ? 'roas-good' : c.metaRoas < 2 ? 'roas-bad' : '';
    return (
      '<tr>' +
        '<td data-label="Campanie">' + escapeHtml(c.name) + '</td>' +
        '<td data-label="Cheltuit">' + fmtMoney(c.spend) + '</td>' +
        '<td data-label="Cumparari (Meta)">' + (c.purchases != null ? c.purchases : 'n/a') + '</td>' +
        '<td data-label="ROAS (Meta)" class="' + roasCls + '">' + (c.metaRoas != null ? c.metaRoas.toFixed(2) + '&times;' : 'n/a') + '</td>' +
      '</tr>'
    );
  }).join('');
  return (
    '<div class="section-title">Campanii (ultimele ' + lookbackDays + ' zile, atribuire Meta)</div>' +
    '<div class="stat-sub" style="margin-bottom:12px">ROAS-ul de aici e cel calculat de Meta (dupa modelul lor de atribuire pe click/vizualizare) -- diferit de ROAS-ul real de mai sus, care e potrivit direct cu comenzile Shopify. Util pt comparat campaniile intre ele, nu ca cifra absoluta de profit.</div>' +
    '<div class="card table-scroll"><table class="trend">' +
      '<thead><tr><th>Campanie</th><th>Cheltuit</th><th>Cumparari (Meta)</th><th>ROAS (Meta)</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>'
  );
}

let pnlDataCache = null;
let pnlPeriod = null; // number of months, null = not yet set (defaults to 1, "Luna curenta")

function renderPnl(data, root) {
  pnlDataCache = data;
  if (pnlPeriod === null) pnlPeriod = 1;
  renderPnlPeriod(root);
}

function setPnlPeriod(months, root) {
  pnlPeriod = months;
  renderPnlPeriod(root || document.getElementById('root-pnl'));
}

/** "Luna curenta" nu mai arata ultima luna reala (poate fi atipica), ci o
 * medie mai realista. COGS foloseste media pe tot intervalul (8 luni) cu
 * costul proiectelor B2B scazut (e singura cifra de proiect verificata,
 * doar ca total agregat pe tot intervalul -- nu se poate izola pe un
 * subset de luni). Marketing/salarii/taxe/altele folosesc media doar pe
 * ultimele 4 luni: Decembrie are salarii/taxe 0 (date lipsa, nu o luna
 * reala fara costuri) si Martie are cifre neobisnuit de mici -- incluse
 * in medie, trag artificial estimarea in jos fata de nivelul actual de
 * echipa/cheltuieli. Venitul B2B recurent istoric NU intra in baseline --
 * utilizatorul prefera sa se raporteze doar la ce adauga manual in
 * "Proiecte B2B incoming", nu la o medie auto-calculata pe care nu o
 * controleaza. */
// echipa curenta, RON/luna -- cifra reala data de utilizator, mai precisa
// decat orice medie istorica (de actualizat manual daca se schimba echipa)
const CURRENT_TEAM_SALARIES = { Felicia: 5000, Flori: 5000, Carl: 4500, Alexio: 8000 };

// taxe platite efectiv in luna curenta (August 2026) -- cifre reale din
// ordinele de plata (Bad Copy: impozit pe profit 6.669 + TVA decont lunar
// 7.103, pt obligatii din Iunie; Simplicated deja platit luna trecuta,
// fara suma noua acum). De actualizat manual cand vine urmatorul decont.
const CURRENT_MONTH_TAXES_PAID = { 'Bad Copy - impozit profit': 6669, 'Bad Copy - TVA': 7103 };

function computeBaselineAverage(data) {
  const rows = data.rows;
  const n = rows.length;
  const recent = rows.slice(-4);
  const rn = recent.length;
  const sum = (key) => rows.reduce((s, r) => s + r[key], 0);
  const sumRecent = (key) => recent.reduce((s, r) => s + r[key], 0);
  const totalProjectCost = Object.values(data.projectCosts).reduce((s, p) => s + p.cost, 0);
  const d2c = sum('d2c') / n;
  const revenue = d2c;
  const cogs = (sum('cogs') - totalProjectCost) / n;
  const marketing = sumRecent('marketing') / rn;
  const salaries = Object.values(CURRENT_TEAM_SALARIES).reduce((a, b) => a + b, 0);
  // Taxe: folosim suma reala platita deja luna asta (CURRENT_MONTH_TAXES_PAID)
  // ca baza cunoscuta -- mai precisa decat orice estimare. "Taxe" e un bucket
  // mixt: TVA si CAS se platesc lunar (urmaresc direct veniturile/salariile
  // lunii), dar impozitul pe profit/venitul microintreprinderilor se
  // plateste trimestrial -- de-asta o luna poate arata taxe mari fara
  // legatura cu propriul ei venit (ex. Iulie, desi n-a avut B2B, reflecta
  // partial decontul trimestrial Q2 care include B2B-urile mari din
  // Apr/Iun). Raportul taxe/venit pe TOT intervalul (fiecare trimestru
  // numarat o singura data) e folosit doar ca fallback cand nu avem o
  // suma reala platita.
  const knownTaxesPaid = Object.values(CURRENT_MONTH_TAXES_PAID).reduce((a, b) => a + b, 0);
  const taxRate = sum('taxes') / sum('revenue');
  const taxes = knownTaxesPaid > 0 ? knownTaxesPaid : revenue * taxRate;
  // "Personal" (calatorii + cumparaturi card firma) nu e cost real de
  // business -- scazut DOAR din baseline-ul Luna curenta, istoricul
  // (Toate/3/6 luni) ramane neatins.
  const personalCat = (data.categoryBreakdown || []).find((c) => c.name.startsWith('Personal'));
  const personalMonthlyAvg = personalCat ? personalCat.val / n : 0;
  const other = sumRecent('other') / rn - personalMonthlyAvg;
  const net = revenue - (cogs + marketing + salaries + taxes + other);
  return {
    label: 'Medie ' + n + ' luni (D2C, fara B2B)', d2c, b2bProject: 0, b2bOther: 0, revenue,
    cogs, marketing, salaries, taxes, other, net, klarnaMissing: false,
  };
}

/** Rand sintetic pt luna curenta (August), folosit doar cand se aduna la
 * "Toate" -- ca istoricul + estimarea curenta sa dea un total realist, nu
 * doar cele 8 luni cu date reale. Foloseste acelasi calcul ca stat cardurile
 * de pe Luna curenta (D2C din rulaj real + B2B incoming). */
function buildCurrentMonthEstimateRow(data) {
  const avg = computeBaselineAverage(data);
  const runRate = computeCurrentMonthRunRate();
  const d2c = runRate ? runRate.projected : avg.revenue;
  const incomingB2BTotal = loadIncomingProjects().reduce((s, p) => s + p.amount, 0);
  const revenue = d2c + incomingB2BTotal;
  const net = revenue - (avg.cogs + avg.marketing + avg.salaries + avg.taxes + avg.other);
  const monthName = new Date().toLocaleDateString('ro-RO', { month: 'short', year: 'numeric' });
  return {
    month: 'estimat', label: monthName + ' (estimat)', d2c, b2bProject: 0, b2bOther: incomingB2BTotal,
    revenue, cogs: avg.cogs, marketing: avg.marketing, salaries: avg.salaries, taxes: avg.taxes, other: avg.other,
    net, klarnaMissing: false,
  };
}

// Recurring Wolf & Badger income, received on an account outside the bank
// statements -- the same monthly figure the documented months include.
const WB_MONTHLY_INCOME = 2525;

function buildProvisionalMonthRow(data, monthDate) {
  const key = monthDate.getFullYear() + '-' + String(monthDate.getMonth() + 1).padStart(2, '0');
  const m = profitDataCache && profitDataCache.months && profitDataCache.months[key];
  if (!m) return null;
  const rows = data.rows;
  const recent = rows.slice(-4);
  const sum = (list, k) => list.reduce((acc, r) => acc + r[k], 0);
  const personalCat = (data.categoryBreakdown || []).find((c) => c.name.startsWith('Personal'));
  const personalMonthlyAvg = personalCat ? personalCat.val / rows.length : 0;
  const d2c = m.revenue;
  const b2bOther = WB_MONTHLY_INCOME;
  const revenue = d2c + b2bOther;
  // Shopify's per-product cost includes labour (already in salaries), so use
  // the documented materials share of non-project revenue instead.
  // Uses the last 3 documented months (closer to the current purchasing
  // pattern than the whole history); project costs are only aggregated per
  // project, so remove the share matching the project revenue in the window.
  const cogsWindow = rows.slice(-3);
  const projectCost = Object.values(data.projectCosts).reduce((acc, pc) => acc + pc.cost, 0);
  const totalProjectRevenue = sum(rows, 'b2bProject');
  const windowProjectCost = totalProjectRevenue > 0 ? projectCost * (sum(cogsWindow, 'b2bProject') / totalProjectRevenue) : 0;
  const cogs = revenue * ((sum(cogsWindow, 'cogs') - windowProjectCost) / (sum(cogsWindow, 'd2c') + sum(cogsWindow, 'b2bOther')));
  const marketing = m.adSpend;
  const salaries = Object.values(CURRENT_TEAM_SALARIES).reduce((a, b) => a + b, 0);
  const taxes = revenue * (sum(rows, 'taxes') / sum(rows, 'revenue'));
  const other = sum(recent, 'other') / recent.length - personalMonthlyAvg;
  const label = monthDate.toLocaleDateString('ro-RO', { month: 'short', year: 'numeric' });
  return {
    month: key.replace('-', '_'), label: label.charAt(0).toUpperCase() + label.slice(1) + ' · provizoriu',
    d2c, b2bProject: 0, b2bOther, revenue, cogs, marketing, salaries, taxes, other,
    net: revenue - (cogs + marketing + salaries + taxes + other), klarnaMissing: false,
    provisional: { orders: m.orders, lastDay: m.lastDay },
  };
}

function pnlFilterButtons(data) {
  const monthOptions = [1, 'lastMonth', 3, 6, data.rows.length];
  return [...new Set(monthOptions)].map((m) => (
    '<button class="period-btn' + (m === pnlPeriod ? ' active' : '') + '" onclick="setPnlPeriod(' + (typeof m === 'string' ? "'" + m + "'" : m) + ')">' +
      (m === data.rows.length ? 'Toate' : m === 1 ? 'Luna curenta' : m === 'lastMonth' ? 'Luna trecuta' : m + ' luni') +
    '</button>'
  )).join('');
}

function renderPnlPeriod(root) {
  const data = pnlDataCache;
  const isSingleMonth = pnlPeriod === 1;
  let filteredRows, t;
  if (isSingleMonth) {
    const avg = computeBaselineAverage(data);
    filteredRows = [avg];
    t = avg;
  } else {
    if (pnlPeriod === 'lastMonth') {
      // Luna trecuta = luna calendaristica anterioara. Actele ei vin abia
      // luna asta, deci pana le adaugam o aratam provizoriu din vanzarile
      // Shopify + Meta (profit-data.json -> months), cu restul costurilor
      // estimate ca la Luna curenta.
      const now = new Date();
      const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const prevKey = prev.getFullYear() + '_' + String(prev.getMonth() + 1).padStart(2, '0');
      const prevRow = data.rows.find((r) => r.month === prevKey) || buildProvisionalMonthRow(data, prev);
      filteredRows = [prevRow || data.rows[data.rows.length - 1]];
    } else {
      filteredRows = data.rows.slice(-pnlPeriod);
    }
    if (pnlPeriod === data.rows.length) {
      // "Toate" include si estimarea lunii curente, nu doar istoricul --
      // altfel totalul pare incomplet fata de ce arata Luna curenta.
      filteredRows = [...filteredRows, buildCurrentMonthEstimateRow(data)];
    }
    t = filteredRows.reduce((acc, r) => {
      acc.d2c += r.d2c; acc.b2bProject += r.b2bProject; acc.b2bOther += r.b2bOther;
      acc.revenue += r.revenue; acc.cogs += r.cogs; acc.marketing += r.marketing;
      acc.salaries += r.salaries; acc.taxes += r.taxes; acc.other += r.other; acc.net += r.net;
      return acc;
    }, { d2c: 0, b2bProject: 0, b2bOther: 0, revenue: 0, cogs: 0, marketing: 0, salaries: 0, taxes: 0, other: 0, net: 0 });
  }

  const filterBtns = pnlFilterButtons(data);
  const historyRows = filteredRows.filter((r) => r.month !== 'estimat');
  const periodLabel = historyRows.length === 1 ? historyRows[0].label
    : historyRows.length ? historyRows[0].label + ' – ' + historyRows[historyRows.length - 1].label : '';

  const statCard = (label, value, sub, cls, tooltip) =>
    '<div class="stat-card"' + (tooltip ? ' title="' + tooltip.replace(/"/g, '&quot;') + '"' : '') + '>' +
    '<div class="stat-label">' + label + '</div>' +
    '<div class="stat-value' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';

  const costsTooltip = (n, recentN) => 'COGS ' + fmtMoney(t.cogs) + (n ? ' (medie ' + n + ' luni)' : '') +
    ' · Marketing ' + fmtMoney(t.marketing) + ' · Salarii ' + fmtMoney(t.salaries) + ' · Taxe ' + fmtMoney(t.taxes) + ' · Altele ' + fmtMoney(t.other) +
    (recentN ? ' (medie ultimele ' + recentN + ' luni)' : '');

  const runRate = isSingleMonth ? computeCurrentMonthRunRate() : null;
  const pnlEstimate = isSingleMonth ? computeCurrentMonthPnlEstimate(t) : null;
  const incomingB2BTotal = pnlEstimate ? pnlEstimate.incomingB2BTotal : 0;
  const d2cEstimate = pnlEstimate ? pnlEstimate.d2cEstimate : t.revenue;
  const costsTotal = pnlEstimate ? pnlEstimate.costsTotal : (t.cogs + t.marketing + t.salaries + t.taxes + t.other);
  const revenueWithIncoming = pnlEstimate ? pnlEstimate.revenueWithIncoming : t.revenue;
  const netWithIncoming = pnlEstimate ? pnlEstimate.netWithIncoming : t.net;
  const stats = isSingleMonth ?
    statCard('Venit D2C estimat (luna curenta)', fmtMoney(d2cEstimate), runRate
      ? fmtMoney(runRate.actual) + ' in ' + runRate.daysElapsed + ' din ' + runRate.daysInMonth + ' zile -- proiectat pe rulaj real'
      : 'medie D2C pe ' + data.rows.length + ' luni (inca nu avem vanzari reale pt luna asta)') +
    statCard('Venit estimat (D2C + B2B incoming)', fmtMoney(revenueWithIncoming), incomingB2BTotal > 0 ? 'D2C ' + fmtMoney(d2cEstimate) + ' + B2B incoming ' + fmtMoney(incomingB2BTotal) : 'niciun proiect B2B incoming adaugat inca') +
    statCard('Costuri medii / luna', fmtMoney(costsTotal), 'COGS (medie ' + data.rows.length + ' luni, fara cost proiecte) · restul (medie ultimele 4 luni)', null, costsTooltip(data.rows.length, 4)) +
    statCard('Rezultat net estimat', (netWithIncoming >= 0 ? '+' : '') + fmtMoney(netWithIncoming), incomingB2BTotal > 0 ? 'D2C real + B2B incoming (' + fmtMoney(incomingB2BTotal) + ')' : 'pe baza vanzarilor D2C reale, fara proiecte B2B', netWithIncoming >= 0 ? 'good' : 'bad')
    :
    statCard('Venit total (' + (periodLabel || filteredRows.length + ' luni') + ')', fmtMoney(t.revenue), 'D2C ' + Math.round(t.d2c / 1000) + 'k &middot; B2B proiecte ' + Math.round(t.b2bProject / 1000) + 'k &middot; B2B altele ' + Math.round(t.b2bOther / 1000) + 'k' + (pnlPeriod === data.rows.length ? ' &middot; include luna curenta (estimat)' : '')) +
    statCard('Costuri totale', fmtMoney(t.cogs + t.marketing + t.salaries + t.taxes + t.other), 'COGS, marketing, salarii, taxe, altele', null, costsTooltip()) +
    statCard('Rezultat net', (t.net >= 0 ? '+' : '') + fmtMoney(t.net), 'profitabil doar datorita B2B', t.net >= 0 ? 'good' : 'bad');

  const mapped = ['COGS', 'Taxe', 'Salarii', 'Marketing'];
  // "Personal" (calatorii + cumparaturi card firma) nu e cost real de
  // business -- exclus DOAR pt Luna curenta (estimare), istoricul
  // (Toate/3/6 luni/Luna trecuta, facts din acte) il pastreaza neatins.
  const excludedCurrentMonth = ['Personal'];
  const isProvisional = filteredRows.length === 1 && !!filteredRows[0].provisional;
  const excludePersonal = isSingleMonth || isProvisional;
  const leftoverRaw = data.categoryBreakdown.filter((c) => !mapped.some((m) => c.name.startsWith(m)) && !(excludePersonal && excludedCurrentMonth.some((m) => c.name.startsWith(m))));
  const leftoverRawSum = leftoverRaw.reduce((s, c) => s + c.val, 0);
  // catSource e mereu derivat din t (totalurile perioadei selectate), deci
  // se actualizeaza cu orice filtru (Luna trecuta, 3/6 luni, Toate) --
  // COGS/Taxe/Salarii/Marketing vin direct din t; restul categoriilor
  // (Neclasificat, Chirie etc, care nu au defalcare lunara in date) sunt
  // scalate proportional la ponderea lor originala pe tot intervalul, ca
  // suma exacta sa dea t.other pt perioada selectata.
  const catSource = data.categoryBreakdown
    .filter((c) => !(excludePersonal && excludedCurrentMonth.some((m) => c.name.startsWith(m))))
    .map((c) => {
      if (c.name.startsWith('COGS')) return { name: isSingleMonth ? 'COGS (marfa/materiale, fara proiecte)' : c.name, val: t.cogs };
      if (c.name.startsWith('Taxe')) return { name: c.name, val: t.taxes };
      if (c.name.startsWith('Salarii')) return { name: c.name, val: t.salaries };
      if (c.name.startsWith('Marketing')) return { name: c.name, val: t.marketing };
      return { name: c.name, val: t.other * (c.val / leftoverRawSum) };
    });
  const maxCat = Math.max(...catSource.map((c) => c.val));
  const catTotal = catSource.reduce((s, c) => s + c.val, 0);
  const catTotalRow =
    '<div class="item" style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)">' +
      '<div style="flex:0 0 220px;font-weight:700">Total</div>' +
      '<div style="flex:1;margin:0 12px"></div>' +
      '<div class="item-hours" style="font-weight:700">' + fmtMoney(catTotal) + '</div>' +
    '</div>';
  const catRows = catSource.map((c) => (
    '<div class="item" style="margin-bottom:10px">' +
      '<div style="flex:0 0 220px" class="item-sub">' + escapeHtml(c.name) + '</div>' +
      '<div style="flex:1;background:var(--border);border-radius:5px;height:8px;overflow:hidden;margin:0 12px">' +
        '<div style="height:100%;border-radius:5px;background:var(--accent);width:' + (c.val / maxCat * 100).toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="item-hours">' + fmtMoney(c.val) + '</div>' +
    '</div>'
  )).join('');

  const projects = data.projectCosts;
  const projectCards = Object.entries(projects).map(([key, p]) => (
    '<div class="stat-card">' +
      '<div class="stat-label">' + escapeHtml(key) + '</div>' +
      '<div class="stat-value good">+' + fmtMoney(p.net) + '</div>' +
      '<div class="stat-sub">venit ' + fmtMoney(p.revenue) + ' &middot; cost ' + fmtMoney(p.cost) + '</div>' +
    '</div>'
  )).join('');

  const baselineCards = data.baseline.map((b) => (
    '<div class="card">' +
      '<div class="person-name" style="font-size:0.9rem">' + escapeHtml(b.name) + '</div>' +
      '<div class="item-sub" style="margin-bottom:10px">CIF ' + escapeHtml(b.cif) + '</div>' +
      '<div class="item"><span>Venituri 2023</span><span class="item-hours">' + fmtMoney(b.rev2023) + '</span></div>' +
      '<div class="item"><span>Rezultat 2023</span><span class="item-hours ' + (b.net2023 >= 0 ? '' : 'roas-bad') + '">' + (b.net2023 >= 0 ? '+' : '') + fmtMoney(b.net2023) + '</span></div>' +
      '<div class="item"><span>Venituri 2024</span><span class="item-hours">' + fmtMoney(b.rev2024) + '</span></div>' +
      '<div class="item"><span>Rezultat 2024</span><span class="item-hours ' + (b.net2024 >= 0 ? '' : 'roas-bad') + '">' + (b.net2024 >= 0 ? '+' : '') + fmtMoney(b.net2024) + '</span></div>' +
    '</div>'
  )).join('');

  const provisionalNote = isProvisional
    ? '<div class="stat-sub" style="margin-bottom:12px">Provizoriu, pana adaugam actele lunii: vanzarile Shopify (' + filteredRows[0].provisional.orders +
      ' comenzi) si cheltuiala Meta sunt reale; COGS e estimat din ponderea materialelor din ultimele 3 luni cu acte, iar salariile, taxele si restul costurilor ca la Luna curenta. B2B include doar venitul recurent Wolf &amp; Badger.</div>'
    : '';
  root.innerHTML =
    '<div class="period-filter">' + filterBtns + '</div>' +
    provisionalNote +
    '<div class="stat-grid">' + stats + '</div>' +
    '<div class="section-title" style="margin-top:24px">Costuri pe categorii</div>' +
    '<div class="card">' + catTotalRow + catRows + '</div>' +
    (isSingleMonth ? '' :
      '<div class="section-title">Proiecte B2B (istoric)</div>' +
      '<div class="stat-grid">' + projectCards + '</div>'
    ) +
    (isSingleMonth ?
      '<div class="section-title">Proiecte B2B incoming</div>' +
      '<div id="incoming-projects-section"></div>' +
      '<div class="section-title">Estimare luna curenta</div>' +
      '<div id="month-estimate-section"></div>'
    : '') +
    (isSingleMonth ? '' :
      '<div class="section-title">Bilanturi oficiale ANAF (2023 vs 2024)</div>' +
      '<div class="grid-two" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">' + baselineCards + '</div>'
    ) +
    '<div class="stat-sub" style="margin-top:20px">' +
      (isSingleMonth
        ? 'COGS medie ' + data.rows.length + ' luni (fara cost proiecte B2B) &middot; restul categoriilor medie ultimele 4 luni (nu avem defalcare lunara reala pe categorii).'
        : 'Categoriile fara defalcare lunara reala (Neclasificat, Chirie etc) sunt scalate proportional cu ponderea lor pe tot intervalul.') +
    '</div>' +
    (isSingleMonth ? '' : '<div class="meta" style="margin-top:8px">' + escapeHtml(data.period) + ' &middot; ' + escapeHtml(data.entities) + '</div>');

  renderIncomingProjectsSection();
  renderMonthEstimateSection(data);
}

/** Computes recommendations live from whatever tabs actually loaded,
 * instead of a fixed static list -- each one only fires if the underlying
 * condition is actually true right now, and reads straight off the same
 * data the other tabs show (no separate/stale copy). Short by design: one
 * sentence of "what's happening", one of "so what to do". */
function computeRecommendations(prod, profit, pnl) {
  const items = [];

  if (profit && profit.days.length) {
    const days = profit.days;
    const rev = days.reduce((s, d) => s + d.revenue, 0);
    const cogs = days.reduce((s, d) => s + d.cogs, 0);
    const spend = days.reduce((s, d) => s + d.adSpend, 0);
    const negDays = days.filter((d) => d.netProfit < 0).length;
    const adPct = rev > 0 ? (spend / rev) * 100 : 0;
    const cogsPct = rev > 0 ? (cogs / rev) * 100 : 0;
    const avgRoas = spend > 0 ? rev / spend : null;

    if (adPct > 25) {
      items.push({
        title: 'Ads consuma ' + adPct.toFixed(0) + '% din venit (ultimele ' + days.length + ' zile)',
        body: 'Peste pragul sanatos de 15-20%. Verifica tab Profit &amp; ROAS -> Campanii si opreste campaniile cu ROAS sub 2x.',
      });
    }
    if (avgRoas != null && avgRoas < 3) {
      items.push({
        title: 'ROAS mediu real: ' + avgRoas.toFixed(2) + '&times;',
        body: 'Sub 3x e strans dupa ce scazi si costul de productie. Compara campaniile individual, nu doar media.',
      });
    }
    if (negDays > 0) {
      items.push({
        title: negDays + ' din ' + days.length + ' zile au fost pe pierdere neta',
        body: 'Vezi tab Profit &amp; ROAS pt zilele exacte -- cauta ce au avut diferit (spend mare, venit mic).',
      });
    }
    if (cogsPct > 0 && cogsPct < 55) {
      items.push({
        title: 'Marja de productie e sanatoasa (~' + (100 - cogsPct).toFixed(0) + '%)',
        body: 'Costul marfii nu e problema -- volumul de vanzari conteaza mai mult decat taierea COGS.',
      });
    }
  }

  if (prod) {
    const backlogH = prod.backlog?.hours || 0;
    const feliciaLoad = prod.felicia ? prod.felicia.hours / prod.felicia.capacity : 0;
    const floriLoad = prod.flori ? prod.flori.hours / prod.flori.capacity : 0;
    if (backlogH > 8) {
      items.push({
        title: backlogH.toFixed(1) + 'h de comenzi reale nu au incaput azi',
        body: 'Presiune de capacitate in crestere -- vezi tab Productie -> Carl (toate merg la taiat, doar cusutul le retine).',
      });
    }
    if (feliciaLoad >= 1 || floriLoad >= 1) {
      items.push({
        title: 'Felicia sau Flori sunt la capacitate maxima azi',
        body: 'Orice comanda noua de azi risca sa treaca pe maine.',
      });
    }
  }

  if (pnl) {
    items.push({
      title: 'Fara proiecte B2B, magazinul e pe pierdere (P&amp;L ' + escapeHtml(pnl.period) + ')',
      body: 'Rezultat fara B2B: ' + fmtMoney(pnl.withoutB2B) + '. Proiectele B2B raman singurul motor de profit constant -- vezi tab P&amp;L.',
    });
    const adPctPnl = pnl.totals.d2c > 0 ? (pnl.totals.marketing / pnl.totals.d2c) * 100 : 0;
    if (adPctPnl > 25) {
      items.push({
        title: 'Marketing = ' + adPctPnl.toFixed(0) + '% din venitul D2C pe tot intervalul P&amp;L',
        body: 'Consistent peste pragul sanatos -- confirma semnalul din datele recente de mai sus.',
      });
    }
    // Rezultatul lunii curente CU B2B incoming (proiectia reala, nu media
    // istorica fara B2B de mai sus) -- semnal mult mai urgent daca iese
    // negativ, pt ca reflecta chiar luna in curs, nu un tipar general.
    if (pnlDataCache) {
      const estimate = computeCurrentMonthPnlEstimate(computeBaselineAverage(pnlDataCache));
      if (estimate.netWithIncoming < 0) {
        items.push({
          title: 'Luna curenta e proiectata pe pierdere: ' + fmtMoney(estimate.netWithIncoming),
          body: 'D2C real + B2B incoming, minus toate costurile -- vezi tab P&amp;L (Luna curenta) sau adauga proiecte B2B noi daca sunt in discutie.',
        });
      }
    }
  }

  // Trends: cate produse active n-au avut nicio vanzare in ultimele 30
  // zile -- semnal direct actionabil (vezi tab Trends -> Losers, buton de
  // unpublish), nu doar informativ.
  if (trendsDataCache && trendsDataCache.periods && trendsDataCache.periods['30']) {
    const period = trendsDataCache.periods['30'];
    const zeroCount = aggregateByName(period.zeroSellers, []).length;
    const totalCount = zeroCount + aggregateByName(period.topSellers, ['units', 'revenue']).length;
    const zeroPct = totalCount > 0 ? (zeroCount / totalCount) * 100 : 0;
    if (zeroCount > 0 && zeroPct > 40) {
      items.push({
        title: zeroCount + ' produse active fara nicio vanzare in 30 zile (' + zeroPct.toFixed(0) + '% din catalog)',
        body: 'Vezi tab Trends -> Losers -- selecteaza ce nu mai are sens sa ramana activ si trimite-mi lista pt unpublish.',
      });
    }
  }

  return items;
}

/** Cate putin din toate tab-urile, pt o privire rapida fara sa navighezi
 * prin fiecare -- foloseste ce e deja incarcat (nu face fetch separat).
 * trendsDataCache/profitDataCache sunt globale, populate deja de
 * renderTrends/renderProfit pana ruleaza asta (ultimul apel din load()). */
function renderOverview(prod, profit, pnl, root) {
  const statCard = (label, value, sub, cls) =>
    '<div class="stat-card"><div class="stat-label">' + label + '</div>' +
    '<div class="stat-value' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';

  const cards = [];

  if (prod) {
    const carlCount = (prod.croit || []).length;
    cards.push(statCard(
      'Productie azi',
      prod.felicia.hours.toFixed(2).replace('.', ',') + 'h / ' + prod.flori.hours.toFixed(2).replace('.', ',') + 'h',
      'Felicia / Flori &middot; Carl are ' + carlCount + ' in asteptare'
    ));
  }

  if (profit && profit.days && profit.days.length) {
    const latest = profit.days[profit.days.length - 1];
    cards.push(statCard(
      'Profit net azi',
      fmtMoney(latest.netProfit),
      'ROAS ' + (latest.roas ?? 'n/a') + ' &middot; venit ' + fmtMoney(latest.revenue),
      latest.netProfit >= 0 ? 'good' : 'bad'
    ));
  }

  const runRate = computeCurrentMonthRunRate();
  if (runRate) {
    cards.push(statCard(
      'Venit D2C proiectat (luna curenta)',
      fmtMoney(runRate.projected),
      fmtMoney(runRate.actual) + ' in ' + runRate.daysElapsed + ' din ' + runRate.daysInMonth + ' zile'
    ));
  }
  // Acelasi numar ca "Rezultat net estimat" din P&L (D2C real + B2B
  // incoming - toate costurile) -- nu cifra ingusta D2C-only, ca sa nu
  // arate dashboard-ul 2 "profituri" diferite pt aceeasi luna.
  if (pnl && pnlDataCache) {
    const pnlEstimate = computeCurrentMonthPnlEstimate(computeBaselineAverage(pnlDataCache));
    cards.push(statCard(
      'Rezultat net estimat (luna curenta)',
      (pnlEstimate.netWithIncoming >= 0 ? '+' : '') + fmtMoney(pnlEstimate.netWithIncoming),
      pnlEstimate.incomingB2BTotal > 0 ? 'D2C real + B2B incoming (' + fmtMoney(pnlEstimate.incomingB2BTotal) + ')' : 'pe baza vanzarilor D2C reale, fara proiecte B2B',
      pnlEstimate.netWithIncoming >= 0 ? 'good' : 'bad'
    ));
  }

  if (trendsDataCache && trendsDataCache.periods && trendsDataCache.periods['30']) {
    const period = trendsDataCache.periods['30'];
    const topList = aggregateByName(period.topSellers, ['units', 'revenue']).sort((a, b) => b.revenue - a.revenue);
    if (topList.length) {
      cards.push(statCard('Top vanzare (30 zile)', escapeHtml(topList[0].title), topList[0].units + ' buc &middot; ' + fmtMoney(topList[0].revenue)));
    }
    const zeroCount = aggregateByName(period.zeroSellers, []).length;
    cards.push(statCard('Fara vanzari (30 zile)', String(zeroCount), 'produse active fara nicio comanda'));
  }

  const recoItems = computeRecommendations(prod, profit, pnl);
  cards.push(statCard(
    'Actiuni de urmarit',
    String(recoItems.length),
    recoItems.length ? recoItems[0].title : 'nimic de semnalat momentan',
    recoItems.length ? 'bad' : 'good'
  ));

  root.innerHTML = cards.length
    ? '<div class="stat-grid">' + cards.join('') + '</div>'
    : '<div class="empty">Inca se incarca datele celorlalte tab-uri.</div>';
}

function renderReco(prod, profit, pnl, root) {
  const items = computeRecommendations(prod, profit, pnl);
  if (!items.length) {
    root.innerHTML = '<div class="empty">Nimic de semnalat momentan -- cifrele arata normal.</div>';
    return;
  }
  const html = items.map((it, i) => (
    '<div class="reco">' +
      '<div class="reco-num">' + (i + 1) + '</div>' +
      '<div class="reco-body"><h4>' + it.title + '</h4><p>' + it.body + '</p></div>' +
    '</div>'
  )).join('');
  root.innerHTML =
    '<div class="meta" style="margin-bottom:16px">Calculat live din tab-urile Productie, Profit &amp; ROAS si P&amp;L</div>' +
    '<div class="reco-list">' + html + '</div>';
}

// ---- Proiecte B2B incoming. Editarea (adauga/sterge) e instant, salvata
// local in browser -- pagina e statica, fara backend/baza de date, deci nu
// poate scrie direct in repo (ar insemna un token de scriere expus in
// pagina publica). b2bSeedCache (fetch la load(), din b2b-projects-data.json)
// e baza sincronizata -- orice device/browser care INCA nu a fost editat
// local porneste de la ea. Dupa prima editare locala, device-ul respectiv
// arata versiunea lui din localStorage pana se cere din nou sincronizarea
// (ii spui lui Claude in chat sa actualizeze fisierul). ----
const LS_PROJECTS_KEY = 'mys_pnl_incoming_projects';
const LS_ESTIMATE_KEY = 'mys_pnl_month_estimate_v2'; // v2: defaults au trecut de la "ultima luna" la "medie fara B2B" -- cheie noua ca sa nu ramana valori vechi persistente in localStorage nesincronizate
let b2bSeedCache = [];

function loadIncomingProjects() {
  try {
    const raw = localStorage.getItem(LS_PROJECTS_KEY);
    if (raw !== null) return JSON.parse(raw) || [];
  } catch (e) {}
  return b2bSeedCache;
}
// Cand lista comuna (b2b-projects-data.json) se schimba, fiecare device o
// preia, chiar daca avea editari locale mai vechi -- altfel o stergere ceruta
// "de acum incolo" ar ramane vizibila pe device-urile deja editate.
const LS_SEED_SIG_KEY = 'mys_pnl_incoming_seed_sig';
function syncIncomingProjectsWithSeed() {
  try {
    const sig = JSON.stringify(b2bSeedCache);
    if (localStorage.getItem(LS_SEED_SIG_KEY) !== sig) {
      localStorage.removeItem(LS_PROJECTS_KEY);
      localStorage.setItem(LS_SEED_SIG_KEY, sig);
    }
  } catch (e) {}
}
function saveIncomingProjects(list) {
  localStorage.setItem(LS_PROJECTS_KEY, JSON.stringify(list));
}
function addIncomingProject() {
  const name = document.getElementById('proj-name').value.trim();
  const amount = Number(document.getElementById('proj-amount').value);
  const month = document.getElementById('proj-month').value.trim();
  const status = document.getElementById('proj-status').value;
  if (!name || !amount) return;
  const list = loadIncomingProjects();
  list.push({ id: Date.now(), name, amount, month: month || '-', status });
  saveIncomingProjects(list);
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-amount').value = '';
  document.getElementById('proj-month').value = '';
  renderPnlPeriod(document.getElementById('root-pnl'));
}
function removeIncomingProject(id) {
  saveIncomingProjects(loadIncomingProjects().filter((p) => p.id !== id));
  renderPnlPeriod(document.getElementById('root-pnl'));
}

function renderIncomingProjectsSection() {
  const el = document.getElementById('incoming-projects-section');
  if (!el) return;
  const list = loadIncomingProjects();
  const total = list.reduce((s, p) => s + p.amount, 0);
  const rows = list.length
    ? list.map((p) => (
        '<div class="proj-row"><span>' + escapeHtml(p.name) +
          '<span class="status-chip ' + p.status + '">' + (p.status === 'confirmat' ? 'confirmat' : 'probabil') + '</span>' +
          (p.month !== '-' ? '<div class="item-sub">' + escapeHtml(p.month) + '</div>' : '') +
        '</span><span style="display:flex;align-items:center;gap:10px">' +
          '<span class="item-hours">' + fmtMoney(p.amount) + '</span>' +
          '<button class="proj-remove" onclick="removeIncomingProject(' + p.id + ')" title="Sterge">&times;</button>' +
        '</span></div>'
      )).join('')
    : '<div class="empty">Niciun proiect adaugat inca.</div>';

  el.innerHTML =
    '<div class="card">' +
      '<div class="block-header"><h2>Total incoming</h2><span class="total">' + fmtMoney(total) + '</span></div>' +
      rows +
      '<div class="form-row" style="margin-top:14px">' +
        '<input class="form-input" id="proj-name" placeholder="Nume proiect" style="flex:1;min-width:140px">' +
        '<input class="form-input" id="proj-amount" type="number" placeholder="Venit estimat (RON)" style="width:170px">' +
        '<input class="form-input" id="proj-month" placeholder="Luna (ex: Sep 2026)" style="width:150px">' +
        '<select class="form-select" id="proj-status"><option value="probabil">Probabil</option><option value="confirmat">Confirmat</option></select>' +
        '<button class="push-btn" onclick="addIncomingProject()">Adauga</button>' +
      '</div>' +
      '<div class="storage-note">Editarea e instant, salvata in acest browser. Ca sa se vada la fel pe toate device-urile, spune-i lui Claude sa actualizeze lista.</div>' +
    '</div>';
}

function loadEstimate(defaults) {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_ESTIMATE_KEY));
    if (saved) return { ...defaults, ...saved };
  } catch (e) {}
  return defaults;
}
function saveEstimateAndRecalc() {
  const fields = ['d2c', 'cogs', 'marketing', 'salaries', 'taxes', 'other'];
  const est = {};
  for (const f of fields) est[f] = Number(document.getElementById('est-' + f).value) || 0;
  localStorage.setItem(LS_ESTIMATE_KEY, JSON.stringify(est));
  est.b2bOther = Number(document.getElementById('est-b2bOther').value) || 0;
  updateEstimateNet(est);
}
function resetEstimate() {
  localStorage.removeItem(LS_ESTIMATE_KEY);
  renderMonthEstimateSection(pnlDataCache);
}
function updateEstimateNet(est) {
  const revenue = est.d2c + (est.b2bOther || 0);
  const costs = est.cogs + est.marketing + est.salaries + est.taxes + est.other;
  const net = revenue - costs;
  const netEl = document.getElementById('estimate-net-value');
  if (netEl) {
    netEl.textContent = (net >= 0 ? '+' : '') + fmtMoney(net);
    netEl.className = 'stat-value ' + (net >= 0 ? 'good' : 'bad');
  }
  const revEl = document.getElementById('estimate-revenue-value');
  if (revEl) revEl.textContent = fmtMoney(revenue) + ' (D2C ' + fmtMoney(est.d2c) + ' + B2B ' + fmtMoney(est.b2bOther || 0) + ')';
}

function renderMonthEstimateSection(pnlData) {
  const el = document.getElementById('month-estimate-section');
  if (!el || !pnlData) return;
  const round2 = (n) => Math.round(n * 100) / 100;
  const avg = computeBaselineAverage(pnlData);
  const runRate = computeCurrentMonthRunRate();
  const incomingTotal = loadIncomingProjects().reduce((s, p) => s + p.amount, 0);
  const defaults = {
    d2c: round2(runRate ? runRate.projected : avg.d2c), b2bOther: round2(incomingTotal), cogs: round2(avg.cogs), marketing: round2(avg.marketing),
    salaries: round2(avg.salaries), taxes: round2(avg.taxes), other: round2(avg.other),
  };
  const est = loadEstimate(defaults);
  est.b2bOther = round2(incomingTotal);
  const now = new Date();
  const monthName = now.toLocaleDateString('ro-RO', { month: 'long', year: 'numeric' });

  const field = (key, label) => (
    '<div class="estimate-field"><label>' + label + '</label>' +
    '<input class="form-input" id="est-' + key + '" type="number" value="' + est[key] + '" oninput="saveEstimateAndRecalc()"></div>'
  );

  el.innerHTML =
    '<div class="card">' +
      '<div class="stat-sub" style="margin-bottom:14px">' + monthName + ' -- editabil. Venit D2C = vanzari reale de pana acum, proiectat pe luna intreaga. COGS = medie pe ' + pnlData.rows.length + ' luni (fara costul proiectelor B2B); restul costurilor = medie ultimele 4 luni. Venitul B2B porneste automat din totalul "Proiecte B2B incoming" de mai sus, dar poti suprascrie manual orice camp.</div>' +
      '<div class="estimate-grid">' +
        field('d2c', 'Venit D2C estimat') +
        field('b2bOther', 'Venit B2B estimat') +
        field('cogs', 'COGS estimat') +
        field('marketing', 'Marketing estimat') +
        field('salaries', 'Salarii estimate') +
        field('taxes', 'Taxe estimate') +
        field('other', 'Altele estimate') +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="stat-label">Venit total estimat</div><div class="stat-value" id="estimate-revenue-value" style="font-size:1rem"></div></div>' +
        '<div class="stat-card"><div class="stat-label">Rezultat net estimat</div><div class="stat-value" id="estimate-net-value"></div></div>' +
      '</div>' +
      '<div class="storage-note">Salvat local, doar in acest browser. <a href="#" onclick="resetEstimate();return false;" style="color:var(--accent)">Reseteaza la valorile implicite</a></div>' +
    '</div>';
  updateEstimateNet(est);
}

let settingsDataCache = null;

function groupSettingsByCategory(products) {
  const byCategory = new Map();
  for (const p of products) {
    const entry = byCategory.get(p.category) || { category: p.category, hours: p.hours, count: 0, costSum: 0, costCount: 0, actualCount: 0 };
    entry.count += 1;
    if (p.cost != null) { entry.costSum += p.cost; entry.costCount += 1; }
    if (p.costSource === 'actual') entry.actualCount += 1;
    byCategory.set(p.category, entry);
  }
  return [...byCategory.values()]
    .map((e) => ({
      category: e.category,
      hours: e.hours,
      count: e.count,
      avgCost: e.costCount > 0 ? e.costSum / e.costCount : null,
      allActual: e.actualCount === e.count,
    }))
    .sort((a, b) => a.category.localeCompare(b.category));
}

// --- Cost & Time (ore/cost pe categorie, editabile) --------------------
// Valorile afisate vin din config.mjs (CATEGORY_HOURS) si din costul mediu
// calculat -- comerciantul poate propune o valoare noua aici (editare
// locala, ca la denumiri atelier), apoi exporta un fisier de trimis
// inapoi ca sa fie aplicata efectiv in cod. Nu schimba nimic live singur.
const LS_CATEGORY_OVERRIDES_KEY = 'mys_category_overrides_v1';

function loadCategoryOverrides() {
  try {
    return JSON.parse(localStorage.getItem(LS_CATEGORY_OVERRIDES_KEY)) || {};
  } catch {
    return {};
  }
}

function saveCategoryOverride(category, field, value) {
  const overrides = loadCategoryOverrides();
  const num = value.trim() === '' ? null : Number(value);
  if (num == null || Number.isNaN(num)) {
    if (overrides[category]) delete overrides[category][field];
    if (overrides[category] && !Object.keys(overrides[category]).length) delete overrides[category];
  } else {
    overrides[category] = overrides[category] || {};
    overrides[category][field] = num;
  }
  localStorage.setItem(LS_CATEGORY_OVERRIDES_KEY, JSON.stringify(overrides));
  updateCategoryOverrideProgress();
}

function updateCategoryOverrideProgress() {
  const el = document.getElementById('category-override-progress');
  if (!el) return;
  const count = Object.keys(loadCategoryOverrides()).length;
  el.textContent = count + ' categorii modificate';
}

function exportCategoryOverrides() {
  const overrides = loadCategoryOverrides();
  const rows = Object.entries(overrides).map(([category, fields]) => ({ category, ...fields }));
  if (!rows.length) {
    alert('Nimic de exportat -- modifica cel putin o valoare mai intai.');
    return;
  }
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cost-time-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importCategoryOverridesFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = JSON.parse(reader.result);
      const overrides = loadCategoryOverrides();
      for (const row of rows) {
        if (!row.category) continue;
        overrides[row.category] = overrides[row.category] || {};
        if (row.hours != null) overrides[row.category].hours = Number(row.hours);
        if (row.cost != null) overrides[row.category].cost = Number(row.cost);
      }
      localStorage.setItem(LS_CATEGORY_OVERRIDES_KEY, JSON.stringify(overrides));
      renderSettingsCategorii(settingsDataCache, document.getElementById('settings-subpanel'));
    } catch (e) {
      alert('Fisier invalid: ' + e.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function renderSettingsCategorii(data, root) {
  const unknownCount = data.products.filter((p) => p.costSource === 'unknown').length;
  root.innerHTML =
    '<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div>' +
        '<div class="meta">' + data.products.length + ' produse active &middot; generat ' + fmtDateTime(data.generatedAt) +
          (unknownCount > 0 ? ' &middot; <span style="color:var(--warn)">' + unknownCount + ' fara cost cunoscut</span>' : '') +
        '</div>' +
        '<div style="font-weight:700;font-size:1rem" id="category-override-progress"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<label class="plan-btn" style="cursor:pointer">Importa<input type="file" accept="application/json" style="display:none" onchange="importCategoryOverridesFile(this)"></label>' +
        '<button class="push-btn" onclick="exportCategoryOverrides()">Exporta fisier</button>' +
      '</div>' +
    '</div>' +
    '<div class="form-row" style="margin-bottom:16px">' +
      '<input class="form-input" id="settings-search" placeholder="Cauta categorie..." style="flex:1;min-width:220px" oninput="filterSettings()">' +
    '</div>' +
    '<div class="card table-scroll"><table class="trend" id="settings-table">' +
      '<thead><tr><th>Categorie</th><th>Produse</th><th>Timp productie</th><th>Cost mediu</th><th>Sursa cost</th></tr></thead>' +
      '<tbody id="settings-tbody"></tbody>' +
    '</table></div>';
  updateCategoryOverrideProgress();
  filterSettings();
}

function filterSettings() {
  const q = (document.getElementById('settings-search')?.value || '').toLowerCase();
  const tbody = document.getElementById('settings-tbody');
  if (!tbody || !settingsDataCache) return;
  const categories = groupSettingsByCategory(settingsDataCache.products);
  const filtered = categories.filter((c) => !q || c.category.toLowerCase().includes(q));
  const overrides = loadCategoryOverrides();
  tbody.innerHTML = filtered.length
    ? filtered.map((c) => {
        const override = overrides[c.category] || {};
        const hoursVal = override.hours != null ? override.hours : c.hours;
        const costVal = override.cost != null ? override.cost : c.avgCost;
        return (
          '<tr>' +
            '<td data-label="Categorie" style="text-align:left">' + escapeHtml(c.category) + '</td>' +
            '<td data-label="Produse">' + c.count + '</td>' +
            '<td data-label="Timp productie">' +
              '<input class="form-input" type="number" step="0.01" min="0" style="width:90px;text-align:right" ' +
                'value="' + (hoursVal != null ? hoursVal : '') + '" placeholder="n/a" ' +
                'data-category="' + escapeHtml(c.category) + '" data-field="hours" onchange="saveCategoryOverrideFromInput(this)">h' +
            '</td>' +
            '<td data-label="Cost mediu">' +
              '<input class="form-input" type="number" step="0.01" min="0" style="width:100px;text-align:right" ' +
                'value="' + (costVal != null ? costVal.toFixed(2) : '') + '" placeholder="n/a" ' +
                'data-category="' + escapeHtml(c.category) + '" data-field="cost" onchange="saveCategoryOverrideFromInput(this)"> RON' +
            '</td>' +
            '<td data-label="Sursa cost"><span class="status-chip ' + (override.cost != null ? 'confirmat' : c.allActual ? 'confirmat' : 'probabil') + '">' +
              (override.cost != null ? 'modificat' : c.allActual ? 'real' : 'partial estimat') +
            '</span></td>' +
          '</tr>'
        );
      }).join('')
    : '<tr><td colspan="5"><div class="empty">Nicio categorie gasita.</div></td></tr>';
}

function saveCategoryOverrideFromInput(el) {
  saveCategoryOverride(el.dataset.category, el.dataset.field, el.value);
}

// --- Denumiri atelier -------------------------------------------------
// Numele scurt "de atelier" (ce citesc de fapt Carl/Felicia/Flori pe task,
// nu titlul complet Shopify) e momentan hardcodat in config.mjs
// (TITLE_OVERRIDES) -- nu exista inca un formular ca sa completeze
// comerciantul toate produsele deodata. Editare locala (persistata in
// localStorage, ca sa nu se piarda intre reincarcari), apoi export ca
// fisier JSON de trimis inapoi ca sa fie aplicat in cod.
const LS_ATELIER_NAMES_KEY = 'mys_atelier_names_v1';

function loadAtelierNames() {
  try {
    return JSON.parse(localStorage.getItem(LS_ATELIER_NAMES_KEY)) || {};
  } catch {
    return {};
  }
}

// Cheia e TITLUL Shopify, nu productId -- config.mjs's TITLE_OVERRIDES
// (unde ajunge in final) e el insusi keyed pe titlu, deci un M/F cu titlu
// IDENTIC (acelasi design, doar 2 listari separate) se aplica automat la
// amandoua cu o singura intrare, fara nicio grupare separata de tinut minte.
function saveAtelierName(title, value) {
  const names = loadAtelierNames();
  if (value.trim()) {
    names[title] = value;
  } else {
    delete names[title];
  }
  localStorage.setItem(LS_ATELIER_NAMES_KEY, JSON.stringify(names));
  updateAtelierProgress();
}

// Titlul vine dintr-un data-attribute (HTML-decodat de browser automat),
// nu interpolat direct intr-un string JS in markup -- sigur chiar daca
// titlul contine apostrof sau ghilimele.
function saveAtelierNameFromInput(el) {
  saveAtelierName(el.dataset.title, el.value);
}

// "(customisable)" nu e un produs propriu-zis de croit/cusut (e optiunea
// de personalizare generica), nu are sens sa apara in lista de denumit.
function atelierEditableProducts() {
  const seen = new Set();
  const out = [];
  for (const p of settingsDataCache?.products || []) {
    if (/\(customisable\)/i.test(p.title)) continue;
    if (seen.has(p.title)) continue;
    seen.add(p.title);
    out.push(p);
  }
  return out;
}

function updateAtelierProgress() {
  const el = document.getElementById('atelier-progress');
  if (!el || !settingsDataCache) return;
  const names = loadAtelierNames();
  const products = atelierEditableProducts();
  const filled = products.filter((p) => (names[p.title] || '').trim()).length;
  el.textContent = filled + ' / ' + products.length + ' completate';
}

function exportAtelierNames() {
  const names = loadAtelierNames();
  const rows = atelierEditableProducts()
    .filter((p) => (names[p.title] || '').trim())
    .map((p) => ({ shopifyTitle: p.title, atelierName: names[p.title].trim() }));
  if (!rows.length) {
    alert('Nimic de exportat -- completeaza cel putin o denumire mai intai.');
    return;
  }
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'denumiri-atelier-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Reimport -- ca sa poti continua editarea pe alt dispozitiv/browser sau
// dupa ce localStorage s-a golit, fara sa iei totul de la capat.
function importAtelierNamesFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = JSON.parse(reader.result);
      const names = loadAtelierNames();
      for (const row of rows) {
        if (row.shopifyTitle && row.atelierName) names[row.shopifyTitle] = row.atelierName;
      }
      localStorage.setItem(LS_ATELIER_NAMES_KEY, JSON.stringify(names));
      renderSettingsAtelier(settingsDataCache, document.getElementById('settings-subpanel'));
    } catch (e) {
      alert('Fisier invalid: ' + e.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function renderSettingsAtelier(data, root) {
  const names = loadAtelierNames();
  root.innerHTML =
    '<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div>' +
        '<div class="item-sub">Denumirea scurta pe care o citesc Carl/Felicia/Flori pe task, nu titlul complet Shopify</div>' +
        '<div style="font-weight:700;font-size:1rem" id="atelier-progress"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<label class="plan-btn" style="cursor:pointer">Importa<input type="file" accept="application/json" style="display:none" onchange="importAtelierNamesFile(this)"></label>' +
        '<button class="push-btn" onclick="exportAtelierNames()">Exporta fisier</button>' +
      '</div>' +
    '</div>' +
    '<div class="form-row" style="margin-bottom:16px">' +
      '<input class="form-input" id="atelier-search" placeholder="Cauta produs sau categorie..." style="flex:1;min-width:220px" oninput="filterSettingsAtelier()">' +
    '</div>' +
    '<div class="card"><div class="zero-list" id="atelier-list"></div></div>';
  updateAtelierProgress();
  filterSettingsAtelier();
}

function filterSettingsAtelier() {
  const q = (document.getElementById('atelier-search')?.value || '').toLowerCase();
  const list = document.getElementById('atelier-list');
  if (!list || !settingsDataCache) return;
  const names = loadAtelierNames();
  const filtered = atelierEditableProducts().filter(
    (p) => !q || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
  );
  list.innerHTML = filtered.length
    ? filtered.map((p) => (
        '<div class="zero-row" style="cursor:default">' +
          prodThumb(p.image, p.title) +
          '<div style="flex:1;min-width:0">' +
            '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(p.title) + '</div>' +
            '<div class="item-sub">' + escapeHtml(p.category) + '</div>' +
          '</div>' +
          '<input class="form-input" style="max-width:220px" placeholder="denumire atelier..." value="' + escapeHtml(names[p.title] || '') + '" ' +
            'data-title="' + escapeHtml(p.title) + '" oninput="saveAtelierNameFromInput(this)">' +
        '</div>'
      )).join('')
    : '<div class="empty">Niciun produs gasit.</div>';
}

let trendsDataCache = null;
let trendsPeriod = 30;
let trendsSubTab = 'winners';
let funnelSort = { key: 'views', dir: 'desc' };

function setFunnelSort(key) {
  funnelSort = funnelSort.key === key ? { key, dir: funnelSort.dir === 'desc' ? 'asc' : 'desc' } : { key, dir: 'desc' };
  renderTrendsPeriod(document.getElementById('root-trends'));
}
function funnelSortIndicator(key) {
  if (funnelSort.key !== key) return '';
  return funnelSort.dir === 'desc' ? ' ▼' : ' ▲';
}

function prodThumb(image, title) {
  return image
    ? '<img class="prod-thumb" src="' + image + '" alt="" loading="lazy">'
    : '<span class="prod-thumb prod-thumb-empty"></span>';
}

// Multe modele au listari separate Men/Women (produse Shopify diferite,
// acelasi design) -- pt trends conteaza designul, nu genul, deci se
// aduna sub acelasi nume in loc sa apara ca 2 randuri separate.
function normalizeProductName(title) {
  return title
    .replace(/\s*[-–]?\s*\((?:men'?s?|women'?s?|man|woman)\)\s*$/i, '')
    .replace(/\s+(?:men'?s?|women'?s?|man|woman)\s*$/i, '')
    .replace(/\s+W\s*$/, '') // convenția W&B pt varianta de dama, vezi TITLE_OVERRIDES din backend
    .trim();
}

function aggregateByName(items, sumFields) {
  const map = new Map();
  for (const p of items) {
    const key = normalizeProductName(p.title).toLowerCase();
    if (!map.has(key)) {
      const entry = { ...p, title: normalizeProductName(p.title) };
      for (const f of sumFields) entry[f] = 0;
      map.set(key, entry);
    }
    const entry = map.get(key);
    for (const f of sumFields) entry[f] += p[f] || 0;
    if (!entry.image && p.image) entry.image = p.image;
  }
  return [...map.values()];
}

function setTrendsPeriod(days) {
  trendsPeriod = days;
  renderTrendsPeriod(document.getElementById('root-trends'));
}

// Nu putem scrie direct in Shopify din pagina publica (ar insemna un token
// Admin API cu drept de scriere expus oricui) -- selectezi produsele,
// copiezi lista, o trimiti in chat.
function copyUnpublishList() {
  const checked = [...document.querySelectorAll('.zero-check:checked')];
  if (!checked.length) {
    alert('Nu ai selectat niciun produs.');
    return;
  }
  const text = 'Unpublish (draft) pe Shopify:\n' + checked.map((el) => '- ' + el.dataset.title + ' (' + el.dataset.id + ')').join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert(checked.length + ' produs(e) copiate -- lipeste in chat cu Claude ca sa le treaca in draft.'),
      () => window.prompt('Copiaza manual (Cmd/Ctrl+C):', text)
    );
  } else {
    window.prompt('Copiaza manual (Cmd/Ctrl+C):', text);
  }
}

function renderTrends(data, root) {
  trendsDataCache = data;
  const available = Object.keys(data.periods || {}).map(Number).sort((a, b) => a - b);
  if (available.length && !available.includes(trendsPeriod)) trendsPeriod = available[available.length - 1];
  renderTrendsPeriod(root);
}

function setTrendsSubTab(tab) {
  trendsSubTab = tab;
  renderTrendsPeriod(document.getElementById('root-trends'));
}

function renderTrendsPeriod(root) {
  const data = trendsDataCache;
  const periodKey = String(trendsPeriod);
  const rawPeriod = (data.periods && data.periods[periodKey]) || { topSellers: [], zeroSellers: [] };
  const period = {
    topSellers: aggregateByName(rawPeriod.topSellers, ['units', 'revenue']).sort((a, b) => b.revenue - a.revenue),
    zeroSellers: aggregateByName(rawPeriod.zeroSellers, []),
    saved: rawPeriod.saved || null,
    funnel: rawPeriod.funnel || null,
  };
  const available = Object.keys(data.periods || {}).map(Number).sort((a, b) => a - b);
  const filterBtns = available.map((p) => (
    '<button class="period-btn' + (p === trendsPeriod ? ' active' : '') + '" onclick="setTrendsPeriod(' + p + ')">' + p + ' zile</button>'
  )).join('');
  const saved = period.saved || { items: [], totalSaves: 0, totalUsers: 0 };
  const funnel = period.funnel || { items: [] };
  const subTabBtns =
    '<button class="period-btn' + (trendsSubTab === 'winners' ? ' active' : '') + '" onclick="setTrendsSubTab(\'winners\')">Winners &middot; ' + period.topSellers.length + '</button>' +
    '<button class="period-btn' + (trendsSubTab === 'losers' ? ' active' : '') + '" onclick="setTrendsSubTab(\'losers\')">Losers &middot; ' + period.zeroSellers.length + '</button>' +
    (period.saved ? '<button class="period-btn' + (trendsSubTab === 'saved' ? ' active' : '') + '" onclick="setTrendsSubTab(\'saved\')">Saved &middot; ' + saved.totalSaves + '</button>' : '') +
    (period.funnel ? '<button class="period-btn' + (trendsSubTab === 'funnel' ? ' active' : '') + '" onclick="setTrendsSubTab(\'funnel\')">Funnel &middot; ' + funnel.items.length + '</button>' : '');

  const maxUnits = Math.max(1, ...period.topSellers.map((p) => p.units));
  const topRows = period.topSellers.length
    ? period.topSellers.map((p, i) => (
        '<tr>' +
          '<td data-label="Produs" style="text-align:left"><div class="prod-cell">' + prodThumb(p.image, p.title) +
            '<span>' + (i + 1) + '. ' + escapeHtml(p.title) + '</span></div></td>' +
          '<td data-label="Bucati">' +
            '<div class="unit-bar"><span style="width:' + Math.round((p.units / maxUnits) * 100) + '%"></span></div>' +
            '<span class="unit-bar-val">' + p.units + '</span>' +
          '</td>' +
          '<td data-label="Venit">' + fmtMoney(p.revenue) + '</td>' +
        '</tr>'
      )).join('')
    : '<tr><td colspan="3"><div class="empty">Nicio vanzare in perioada asta.</div></td></tr>';

  const zeroRows = period.zeroSellers.length
    ? period.zeroSellers.map((p) => (
        '<label class="zero-row">' +
          '<input type="checkbox" class="zero-check" data-title="' + escapeHtml(p.title) + '" data-id="' + escapeHtml(p.productId) + '">' +
          prodThumb(p.image, p.title) +
          '<span>' + escapeHtml(p.title) + '</span>' +
        '</label>'
      )).join('')
    : '<div class="empty">Toate produsele active au avut cel putin o vanzare.</div>';

  const winnersPanel =
    '<div class="card table-scroll"><table class="trend">' +
      '<thead><tr><th>Produs</th><th>Bucati vandute</th><th>Venit</th></tr></thead>' +
      '<tbody>' + topRows + '</tbody>' +
    '</table></div>';
  const losersPanel =
    '<div class="card">' +
      '<div class="block-header">' +
        '<div class="item-sub">Produse active fara nicio vanzare in perioada selectata.</div>' +
        (period.zeroSellers.length ? '<button class="plan-btn" onclick="copyUnpublishList()">Copiaza selectia (unpublish)</button>' : '') +
      '</div>' +
      '<div class="zero-list">' + zeroRows + '</div>' +
    '</div>';

  const maxSaves = Math.max(1, ...saved.items.map((p) => p.saves));
  const savedRows = saved.items.length
    ? saved.items.map((p, i) => (
        '<tr>' +
          '<td data-label="Produs" style="text-align:left"><div class="prod-cell">' + prodThumb(p.image, p.title) +
            '<span>' + (i + 1) + '. ' + escapeHtml(p.title) + '</span></div></td>' +
          '<td data-label="Saves">' +
            '<div class="unit-bar"><span style="width:' + Math.round((p.saves / maxSaves) * 100) + '%"></span></div>' +
            '<span class="unit-bar-val">' + p.saves + '</span>' +
          '</td>' +
        '</tr>'
      )).join('')
    : '<tr><td colspan="2"><div class="empty">Niciun produs salvat in perioada asta.</div></td></tr>';
  const savedPanel =
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="item-sub">' + saved.totalSaves + ' salvari totale &middot; ' + saved.totalUsers + ' utilizatori distincti care au salvat ceva (date din GA4, evenimentul add_to_wishlist)</div>' +
    '</div>' +
    '<div class="card table-scroll"><table class="trend">' +
      '<thead><tr><th>Produs</th><th>Saves</th></tr></thead>' +
      '<tbody>' + savedRows + '</tbody>' +
    '</table></div>';

  const funnelConversion = (p) => (p.views ? (p.purchases / p.views) * 100 : -1);
  const funnelSortKeys = {
    views: (p) => p.views,
    addToCart: (p) => p.addToCart,
    purchases: (p) => p.purchases,
    conversion: funnelConversion,
  };
  const sortedFunnelItems = [...funnel.items].sort((a, b) => {
    const getter = funnelSortKeys[funnelSort.key] || funnelSortKeys.views;
    return funnelSort.dir === 'desc' ? getter(b) - getter(a) : getter(a) - getter(b);
  });
  // Auto-flag: enough real traffic (not just 1-2 stray views) but almost
  // nobody converts -- that's a pricing/description/photo problem, not a
  // traffic problem, worth a merchant's eye. Thresholds are deliberately
  // simple/explainable rather than statistically fancy.
  const FUNNEL_PROBLEM_MIN_VIEWS = 50;
  const FUNNEL_PROBLEM_MAX_CONVERSION = 1; // percent
  const isFunnelProblem = (p) => p.views >= FUNNEL_PROBLEM_MIN_VIEWS && funnelConversion(p) < FUNNEL_PROBLEM_MAX_CONVERSION;
  const funnelProblemCount = sortedFunnelItems.filter(isFunnelProblem).length;
  const funnelRows = sortedFunnelItems.length
    ? sortedFunnelItems.map((p, i) => (
        '<tr class="' + (isFunnelProblem(p) ? 'funnel-problem-row' : '') + '">' +
          '<td data-label="Produs" style="text-align:left"><div class="prod-cell">' +
            (isFunnelProblem(p) ? '<span class="funnel-problem-flag" title="Trafic real, aproape nicio conversie">⚠</span>' : '') +
            prodThumb(p.image, p.title) +
            '<span title="' + escapeHtml(p.title) + '">' + (i + 1) + '. ' + escapeHtml(p.title) + '</span></div></td>' +
          '<td data-label="Vizualiz.">' + p.views + '</td>' +
          '<td data-label="In cos">' + p.addToCart + '</td>' +
          '<td data-label="Cumparat">' + p.purchases + '</td>' +
          '<td data-label="Conv.">' + (p.views ? Math.round(funnelConversion(p) * 10) / 10 + '%' : '-') + '</td>' +
        '</tr>'
      )).join('')
    : '<tr><td colspan="5"><div class="empty">Nicio vizualizare/adaugare in cos in perioada asta.</div></td></tr>';
  const funnelTh = (key, label) =>
    '<th class="sortable-th" onclick="setFunnelSort(\'' + key + '\')">' + label + funnelSortIndicator(key) + '</th>';
  const funnelPanel =
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="item-sub">Vizualizari (view_item) si adaugari in cos (add_to_cart) din GA4, cumparari din comenzile Shopify reale -- un produs cu multe vizualizari dar putine cumparari arata o problema de pret/descriere, nu lipsa de trafic. Click pe o coloana ca sa sortezi.</div>' +
      (funnelProblemCount
        ? '<div style="margin-top:8px;color:var(--bad)">⚠ ' + funnelProblemCount + ' produs(e) cu trafic real (' + FUNNEL_PROBLEM_MIN_VIEWS + '+ vizualizari) dar sub ' + FUNNEL_PROBLEM_MAX_CONVERSION + '% conversie -- marcate mai jos.</div>'
        : '') +
    '</div>' +
    '<div class="card"><table class="trend trend--funnel">' +
      '<thead><tr><th>Produs</th>' + funnelTh('views', 'Vizualiz.') + funnelTh('addToCart', 'In cos') + funnelTh('purchases', 'Cumparat') + funnelTh('conversion', 'Conv.') + '</tr></thead>' +
      '<tbody>' + funnelRows + '</tbody>' +
    '</table></div>';

  const activePanel =
    trendsSubTab === 'losers' ? losersPanel :
    trendsSubTab === 'saved' ? savedPanel :
    trendsSubTab === 'funnel' ? funnelPanel :
    winnersPanel;

  root.innerHTML =
    '<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div><div class="item-sub">Trends -- ce functioneaza si ce nu</div><div style="font-weight:700;font-size:1rem">' + period.topSellers.length + ' produse cu vanzari &middot; ' + period.zeroSellers.length + ' fara nicio vanzare</div></div>' +
      '<div class="period-filter">' + filterBtns + '</div>' +
    '</div>' +
    '<div class="period-filter" style="margin-bottom:16px">' + subTabBtns + '</div>' +
    activePanel;
}

initTabs();
load();

// Doar in dezvoltare locala (localhost / IP privat) -- verifica la 1.5s
// daca fisierul s-a schimbat (Last-Modified de la server) si da reload
// singur. Nu ruleaza pe site-ul live (github.io), ca sa nu faca polling
// degeaba la vizitatori reali.
(function () {
  var isLocal = /^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(location.hostname);
  if (!isLocal) return;
  var lastModified = null;
  setInterval(function () {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var lm = res.headers.get('Last-Modified');
        if (lastModified === null) { lastModified = lm; return; }
        if (lm && lm !== lastModified) location.reload();
      })
      .catch(function () {});
  }, 1500);
})();
