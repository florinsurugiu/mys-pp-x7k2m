<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ANAF · cod de autorizare</title>
<style>
  :root { --bg: #14161a; --card: #1c1f25; --border: #2a2e36; --text: #eceef1; --dim: #9aa1ad; --accent: #5fc2c9; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px 16px; }
  .card { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px; }
  p { color: var(--dim); margin: 0 0 14px; }
  code { display: block; word-break: break-all; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 0.95rem; }
  button { margin-top: 12px; background: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Cod de autorizare ANAF</h1>
  <p id="hint">Apasă „Copiază” și trimite codul lui Claude în chat ACUM (ANAF îl acceptă doar ~60 de secunde).</p>
  <code id="code"></code>
  <button id="copy" type="button">Copiază</button>
  <form id="start" hidden>
    <label for="cid" style="display:block;color:var(--dim);margin-bottom:6px">Client ID (de la ANAF, din „Editare profil Oauth”)</label>
    <input id="cid" autocomplete="off" style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit">
    <button type="submit">Autentificare ANAF cu certificatul</button>
  </form>
</div>
<script>
  // ANAF redirects here after the certificate login (OAuth callback). The
  // code is useless without the app's client secret, which never touches
  // this page.
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  const box = document.getElementById('code');
  if (code) {
    box.textContent = code;
  } else if (q.get('error')) {
    document.getElementById('title').textContent = 'ANAF a refuzat logarea';
    document.getElementById('hint').textContent = q.get('error_description') || q.get('error');
    box.hidden = true;
    document.getElementById('copy').hidden = true;
  } else {
    // Start page: build the ANAF authorize link from the Client ID (not a
    // secret; it is part of the login URL anyway).
    document.getElementById('title').textContent = 'Conectare ANAF e-Factura';
    document.getElementById('hint').textContent = 'Deschide pagina asta pe calculatorul cu certificatul digital, cu stick-ul introdus.';
    box.hidden = true;
    document.getElementById('copy').hidden = true;
    const form = document.getElementById('start');
    form.hidden = false;
    try { document.getElementById('cid').value = localStorage.getItem('anaf_client_id') || ''; } catch (e) {}
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const cid = document.getElementById('cid').value.trim();
      if (!cid) return;
      try { localStorage.setItem('anaf_client_id', cid); } catch (e) {}
      const redirect = location.origin + location.pathname;
      location.href = 'https://logincert.anaf.ro/anaf-oauth2/v1/authorize?response_type=code&client_id=' + encodeURIComponent(cid) + '&redirect_uri=' + encodeURIComponent(redirect) + '&token_content_type=jwt';
    });
  }
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById('copy').textContent = 'Copiat'; } catch (e) {}
  });
</script>
</body>
</html>
